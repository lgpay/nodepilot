<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodePilot 控制台</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e6e9ee; --text: #1c1f26; --muted: #7c8494;
    --primary: #2563eb; --primary-strong: #1d4ed8; --primary-soft: #eaf1fe;
    --danger: #dc2626; --danger-strong: #b91c1c; --danger-soft: #fdecec;
    --ok: #16a34a; --ok-soft: #e9f6ee; --warn: #d97706; --warn-soft: #fdf3e5;
    --header-bg: #ffffff; --header-fg: #1c1f26; --header-accent: #2563eb;
    --sidebar-bg: #ffffff; --sidebar-fg: #4b5563; --sidebar-hover: #f3f5f8; --sidebar-act: #eaf1fe;
    --input-bg: #ffffff; --input-border: #d8dce3; --input-dis: #f2f3f5;
    --code-bg: #f3f5f8; --code-fg: #3f4754;
    --shadow: 0 1px 3px rgba(16,24,40,.07);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.15);
    --radius: 10px; --radius-sm: 6px; --radius-pill: 999px;
    --maxw: 1180px;
  }
  [data-theme="dark"] {
    --bg: #0f1116; --card: #171a21; --border: #262c38; --text: #e6eaf1; --muted: #8b94a6;
    --primary: #3b82f6; --primary-strong: #60a5fa; --primary-soft: #1a2740;
    --danger: #f87171; --danger-strong: #fca5a5; --danger-soft: #3a2226;
    --ok: #4ade80; --ok-soft: #142b1d; --warn: #fbbf24; --warn-soft: #332912;
    --header-bg: #0d0f14; --header-fg: #e6eaf1; --header-accent: #3b82f6;
    --sidebar-bg: #0d0f14; --sidebar-fg: #a0a9ba; --sidebar-hover: #1a1e28; --sidebar-act: #1a2740;
    --input-bg: #13161d; --input-border: #2c3340; --input-dis: #1a1d25;
    --code-bg: #0d0f14; --code-fg: #7ee787;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: var(--primary); }

  header { background: var(--header-bg); color: var(--header-fg); padding: 0 18px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; border-bottom: 1px solid var(--border); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 6px; display: block; object-fit: contain; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  header .right { display: flex; align-items: center; gap: 9px; }
  header .right .chk { color: var(--header-fg); }
  header .right button { color: var(--header-fg); border-color: var(--input-border); }
  header .right button:hover { background: var(--sidebar-hover); border-color: var(--muted); color: var(--header-fg); }
  .burger { display: none; background: transparent; color: var(--header-fg); border: 0; font-size: 20px; cursor: pointer; padding: 0 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card > h2:first-child, .card > h3:first-child { margin-top: 0; }
  .card h2 { font-size: 16px; margin: 0 0 14px; font-weight: 650; }
  .card h3 { font-size: 13px; margin: 18px 0 10px; color: var(--muted); font-weight: 600; }
  .card h3:first-child { margin-top: 0; }
  label { display: block; font-size: 12.5px; margin: 10px 0 4px; color: var(--muted); font-weight: 500; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--input-border); border-radius: var(--radius-sm); background: var(--input-bg); color: var(--text); font-size: 13px; transition: border-color .15s, box-shadow .15s; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  input:disabled { background: var(--input-dis); color: var(--muted); cursor: default; }
  button { background: var(--primary); color: #fff; border: 0; padding: 9px 16px; border-radius: var(--radius-sm); cursor: pointer; margin-top: 12px; font-size: 13px; font-weight: 600; transition: background .15s, opacity .15s, transform .08s; }
  button:hover { background: var(--primary-strong); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--input-border); }
  button.secondary:hover { background: var(--bg); border-color: var(--muted); }
  [data-theme="dark"] button.secondary { color: var(--text); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-strong); }
  button.small { padding: 5px 11px; font-size: 12px; margin-top: 0; }
  button.sm { padding: 2px 8px; font-size: 11px; margin: 0 0 0 6px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-top: 14px; }
  .btnrow button { margin-top: 0; }
  .chk { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
  .chk input { width: auto; margin: 0; accent-color: var(--primary); }
  .mbar { width: 100%; height: 10px; border-radius: var(--radius-pill); background: var(--input-border); overflow: hidden; }
  .mbar-fill { height: 100%; border-radius: var(--radius-pill); background: var(--primary); transition: width .4s ease; }
  .mbar-fill.warn { background: var(--warn); }
  .mbar-fill.danger { background: var(--danger); }
  .inblist { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--bg); display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 16px; align-items: start; }
  .inblist .chk { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .inblist .chk span, .inblist .chk b { white-space: nowrap; }
  .inblist .chk b { color: var(--text); font-weight: 600; }
  .subcli { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 0 4px 22px; border-bottom: 1px dashed var(--border); margin-bottom: 2px; }
  .subcli .chk { font-size: 12px; color: var(--muted); }
  .qr { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .qr img { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; padding: 6px; }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; min-width: 0; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }

  .tblwrap { overflow: auto; max-height: 460px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; background: var(--card); z-index: 1; }
  .tbl tbody tr { transition: background .12s; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl tbody tr:hover { background: var(--primary-soft); }
  [data-theme="dark"] .tbl tbody tr:hover { background: rgba(59,130,246,.12); }
  .search { margin-bottom: 10px; max-width: 280px; }

  pre { background: var(--code-bg); color: var(--code-fg); padding: 14px; border-radius: var(--radius-sm); overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 420px; }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 9px; background: #eef2f7; color: #475569; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; }
  [data-theme="dark"] .badge { background: #263041; color: #b6c2d4; }
  .badge.blue { background: var(--primary-soft); color: var(--primary-strong); }
  [data-theme="dark"] .badge.blue { color: #93c5fd; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.off { background: var(--danger-soft); color: var(--danger); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.neutral { background: var(--primary-soft); color: var(--primary-strong); }
  .ok { color: var(--ok); } .off { color: var(--danger); } .warn { color: var(--warn); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .link { color: var(--primary); word-break: break-all; }

  #app { flex: 1 1 auto; display: flex; min-height: 0; }
  .sidebar { width: 280px; flex: 0 0 auto; background: var(--sidebar-bg); color: var(--sidebar-fg); overflow-y: auto; padding: 12px 10px 24px; border-right: 1px solid var(--border); }
  .main { flex: 1 1 auto; overflow-y: auto; padding: 22px 26px; }
  @media (min-width: 1300px) { .main { max-width: var(--maxw); margin: 0 auto; width: 100%; } }
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 400px; margin: 0; border-radius: var(--radius); }
  .login-card .brand { justify-content: center; margin-bottom: 12px; }
  .login-logo { width: 220px; max-width: 80%; height: auto; display: block; }

  .sb-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 16px 8px 6px; text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
  .sb-head:first-child { margin-top: 4px; }
  .sb-head .sm { background: transparent; color: var(--sidebar-fg); border: 1px solid var(--input-border); margin: 0 0 0 6px; }
  .sb-head .sm:hover { background: var(--sidebar-hover); color: var(--text); }
  .ti { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--sidebar-fg); transition: background .12s, color .12s; position: relative; }
  .ti:hover { background: var(--sidebar-hover); color: var(--text); }
  .ti.active { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; }
  .ti.active .muted { color: var(--primary); }
  .ti .caret { width: 14px; text-align: center; color: var(--muted); user-select: none; flex: 0 0 auto; }
  .ti.active .caret { color: var(--primary); }
  .ti .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti.indent { padding-left: 30px; }
  .ti.indent2 { padding-left: 52px; }
  .ti.leaf { padding-left: 30px; cursor: default; color: var(--muted); }
  .ti.leaf2 { padding-left: 52px; cursor: default; color: var(--muted); }
  .ti.leaf:hover { background: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--danger); } .dot.warn { background: var(--warn); }

  .crumb { font-size: 14px; margin-bottom: 16px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .crumb b { color: var(--text); }

  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8,11,18,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow: auto; animation: fade .15s ease; }
  .modal.hidden { display: none; }
  .modalcard { width: 460px; max-width: 100%; max-height: calc(100vh - 40px); overflow-y: auto; margin: 0; box-shadow: var(--shadow-lg); border-radius: var(--radius); animation: pop .18s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(8px); background: var(--header-bg); color: var(--header-fg); padding: 11px 20px; border-radius: 10px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 99; font-size: 13px; max-width: 84vw; box-shadow: var(--shadow-lg); font-weight: 500; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--ok); color: #fff; }
  .toast.err { background: var(--danger); color: #fff; }
  .toast.warn { background: var(--warn); color: #fff; }

  /* 强制改密横幅 */
  .banner { display: flex; align-items: center; gap: 12px; background: var(--warn-soft); color: #92600a;
    border-bottom: 1px solid #f3d28a; padding: 11px 20px; font-size: 13.5px; }
  [data-theme="dark"] .banner { background: #332a14; color: #ffd98a; border-bottom-color: #5a4a1a; }
  .banner.hidden { display: none; }
  .banner .grow { flex: 1; }
  .banner b { color: var(--danger); }

  .kpis { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .kpi { flex: 1; min-width: 140px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .kv { font-size: 26px; font-weight: 750; color: var(--text); letter-spacing: -.5px; }
  .kl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .bar { display: inline-block; width: 90px; height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
  .bar span { display: block; height: 100%; background: var(--primary); }
  .barchart { display: flex; align-items: flex-end; gap: 4px; height: 220px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
  .bcol { flex: 1 0 28px; min-width: 28px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bval { font-size: 10px; color: var(--muted); white-space: nowrap; transform: scale(.9); margin-bottom: 2px; }
  .bar-v { width: 70%; max-width: 30px; height: 180px; background: var(--border); border-radius: 4px 4px 0 0; overflow: hidden; display: flex; align-items: flex-end; }
  .bar-v span { display: block; width: 100%; background: var(--primary); border-radius: 4px 4px 0 0; }
  .bdate { font-size: 10px; color: var(--muted); margin-top: 4px; white-space: nowrap; }

  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .qcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .14s; }
  .qcard:hover { border-color: var(--primary); }
  .qcard .ic { font-size: 28px; }
  .qcard .tt { font-weight: 650; margin-top: 10px; }
  .qcard .ds { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

  details.adv { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 10px; background: var(--bg); }
  details.adv summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details.adv[open] summary { margin-bottom: 8px; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 40px 0; justify-content: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 13px; }
  .empty .em-ic { font-size: 30px; opacity: .5; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 滚动条 */
  .sidebar::-webkit-scrollbar, .main::-webkit-scrollbar, .tblwrap::-webkit-scrollbar, .modalcard::-webkit-scrollbar, pre::-webkit-scrollbar { width: 9px; height: 9px; }
  .sidebar::-webkit-scrollbar-thumb, .main::-webkit-scrollbar-thumb, .tblwrap::-webkit-scrollbar-thumb, .modalcard::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb { background: rgba(120,130,150,.35); border-radius: 8px; }
  .sidebar::-webkit-scrollbar-thumb:hover, .main::-webkit-scrollbar-thumb:hover { background: rgba(120,130,150,.55); }

  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 56px; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s; width: 264px; box-shadow: var(--shadow-lg); }
    .sidebar.open { transform: translateX(0); }
    .burger { display: block; }
    .main { padding: 14px; }
    .row { flex-direction: column; }
  }
  @media (max-width: 560px) {
    .tblwrap { overflow-x: auto; }
    .tbl { min-width: 560px; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <button class="burger" id="burgerBtn" onclick="toggleSidebar()">☰</button>
    <img class="logo" src="logo.png" alt="NodePilot">
    <h1>NodePilot 控制台</h1>
  </div>
  <div id="headerRight" class="right hidden">
    <label class="chk"><input type="checkbox" id="autoSyncChk" onchange="setAutoSync(this.checked)"> 自动下发</label>
    <button class="secondary small" id="darkBtn" onclick="toggleDark()">🌙 暗色</button>
    <span id="who" class="muted"></span>
    <button class="secondary small" onclick="showChangePw()">修改密码</button>
    <button class="secondary small" onclick="logout()">退出</button>
  </div>
</header>

<div id="pwBanner" class="banner hidden">
  <span class="grow">⚠ <b>初始密码：</b>请立即修改管理员密码。</span>
  <button onclick="showChangePw(true)">去修改</button>
</div>

<div id="loginWrap" class="login-wrap hidden">
  <div id="login" class="card login-card">
    <div class="brand"><img class="login-logo" src="lockup.png" alt="NodePilot"></div>
    <h2>登录</h2>
    <label>用户名</label><input id="user" value="admin" onkeydown="if(event.key==='Enter')login()">
    <label>密码</label><input id="pass" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" style="width:100%">登录</button>
    <span id="loginMsg" class="muted"></span>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="main" class="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="card modalcard" id="modalBody"></div></div>
<div id="toast" class="toast"></div>

<script>
const API = '/api/v1';
let token = localStorage.getItem('np_token') || '';
let sel = { type: null, id: null, parentId: null };
let nodesData = [];
let inboundsCache = {};   // nodeId -> [inbound]
let clientsCache = {};    // inboundId -> [client]
let subsData = [];
let certsData = [];
let notifData = [];
let inboundCatalog = [];
let subFiltersBase = ''; // 当前订阅已有的 filters JSON(合并基础,避免保存时丢失)
let currentNotifType = 'email';
let expandedNodes = new Set();
let expandedInbounds = new Set();
let autoSync = localStorage.getItem('np_autosync') === '1';
let dark = localStorage.getItem('np_dark') === '1';
let refreshTimer = null;
let confirmRes = null;
let statsData = null;

// ---- 主题 ----
function applyTheme() {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const b = document.getElementById('darkBtn'); if (b) b.textContent = dark ? '☀️ 浅色' : '🌙 暗色';
}
function toggleDark() { dark = !dark; localStorage.setItem('np_dark', dark ? '1' : ''); applyTheme(); }
applyTheme();

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function chk(id) { const e = document.getElementById(id); return e ? e.checked : false; }
function authH() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

// api：非 2xx 统一 toast 服务端 error 并返回 null，避免"失败却提示成功"
async function api(method, path, body) {
  let r;
  try { r = await fetch(API + path, { method, headers: authH(), body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { showToast('网络错误，请检查连接', 'err'); return null; }
  if (r.status === 401 && path !== '/auth/login') {
    showToast('登录已失效，请重新登录');
    forceLogin(); return null;
  }
  const data = await r.json().catch(() => ({}));
  if (r.status === 403 && data.must_change_pwd) {
    showToast(data.error || '请先修改管理员密码', 'err');
    forceChangePw(); return null;
  }
  if (!r.ok) { showToast(data.error || ('请求失败 HTTP ' + r.status), 'err'); return null; }
  return data;
}

let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(t);
    else { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); if (!ok) throw new Error('copy'); }
    showToast('已复制', 'ok');

}
async function copySubContent(stoken) {

// 防重复提交：禁用按钮 + "处理中…"，finally 恢复
async function withBusy(btn, fn) {
  if (!btn) return fn();
  const old = btn.textContent;

  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}
// 自定义确认弹窗（Promise<boolean>）

// 显示/隐藏强制改密横幅

}

document.addEventListener('keydown', e => {

// ---- 侧边栏 ----
function dotOf(n) { return n.status === 'online' ? 'on' : (n.status === 'offline' ? 'off' : (n.connectivity === 'offline' ? 'off' : (n.connectivity === 'ok' ? 'on' : 'warn'))); }
function inboundLabel(inb) { return inb.name || ((inb.protocol || '?') + ':' + (inb.port || '?')); }
// 节点状态徽标：综合 status / connectivity 给出 ok/off/warn 三态
function statusPill(n) {
  const s = n.status, c = n.connectivity;
  if (s === 'offline' || c === 'offline') return '<span class="pill off">离线</span>';
  if (s === 'online' && c === 'ok') return '<span class="pill ok">在线 · 连通</span>';
  if (s === 'online') return '<span class="pill warn">在线 · 不通</span>';
  return '<span class="pill warn">' + esc(s || '未知') + '</span>';
}
// 证书状态徽标：valid→ok，failed/expired→off，其余 warn
// 证书状态中文名：issued=Let's Encrypt 已成功签发（含自动续签），pending=申请中
function certStatusLabel(s) {
  const m = { pending: '申请中', issued: '已签发', valid: '有效', ok: '有效', failed: '签发失败', expired: '已过期', error: '签发失败' };
  return m[(s || '').toLowerCase()] || s || '未知';
}
function certPill(c) {
  const st = (c.status || '').toLowerCase();
  if (st === 'valid' || st === 'ok') return '<span class="pill ok">' + certStatusLabel(c.status) + '</span>';
  if (st === 'failed' || st === 'expired' || st === 'error') return '<span class="pill off">' + certStatusLabel(c.status) + '</span>';
  return '<span class="pill warn">' + certStatusLabel(c.status) + '</span>';
}

function fmtBytes(b) {
  b = Number(b) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i === 0 ? b : b.toFixed(2)) + ' ' + u[i];
}

// 区域展示：国家（中文名）+ 城市，如"德国·法兰克福"；无数据回退"识别中…"
function regionLabel(n) {
  if (!n) return '';
  const r = n.region || '', c = n.city || '';
  return (r || c) ? (r + (c ? '·' + c : '')) : '识别中…';
}
// 节点详情：打开时若已保存过区域则直接显示（IP 固定，无需重复实时查询）；
// 仅当节点无区域信息时才调用 /geo 识别一次并持久化
async function detectRegion(id) {
  const n = nodesData.find(x => x.id === id); if (!n || !n.address) return;
  const el = document.getElementById('n_region'); if (el) el.value = regionLabel(n);
  // 已有存库区域：直接使用，不请求外部服务
  if (n.region || n.city) return;
  const d = await api('GET', '/geo?host=' + encodeURIComponent(n.address));
  if (!d) { if (el) el.value = regionLabel(n); return; }
  const name = d.country || d.country_code || '';
  const city = d.city || d.region || '';
  if (el) el.value = (name ? (city ? name + '·' + city : name) : '（识别失败）');
  if (name && (name !== (n.region || '') || city !== (n.city || ''))) {
    const r = await api('PATCH', '/nodes/' + id, { region: name, city: city });
    if (r) { await loadNodes(); }
  }
}
// 新建节点弹窗：填写地址后（失焦）自动识别区域，无需手填；国家与城市分存，旗帜只用国家
async function detectRegionNew() {
  const addr = val('m_n_addr'); if (!addr) return;
  const el = document.getElementById('m_n_region'); if (el) el.value = '识别中…';
  const d = await api('GET', '/geo?host=' + encodeURIComponent(addr));
  if (d && (d.country || d.country_code)) {
    const name = d.country || d.country_code;
    const city = d.city || d.region || '';
    if (el) el.value = city ? name + '·' + city : name;
    document.getElementById('m_n_country').value = name;
    document.getElementById('m_n_city').value = city;
  } else if (el) el.value = '（识别失败）';
}

        '<div class="bdate">' + x.date.slice(5) + '</div></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="card"><h2>按节点</h2>';
  if (!d.nodes || !d.nodes.length) h += '<div class="empty"><div class="em-ic">📡</div>暂无节点流量数据</div>';
  else {
    h += '<div class="tblwrap"><table class="tbl"><thead><tr><th>节点</th><th>上行</th><th>下行</th><th>合计</th></tr></thead><tbody>';
    d.nodes.forEach(n => { h += '<tr><td>' + esc(n.name || ('#' + n.node_id)) + '</td><td>' + fmtBytes(n.up) + '</td><td>' + fmtBytes(n.down) + '</td><td>' + fmtBytes(n.up + n.down) + '</td></tr>'; });

  }
  h += '</div>';

  else {
    h += '<input class="search" placeholder="搜索客户端…" oninput="filterRows(\'stats_clients_tb\', this.value)">';
    h += '<div class="tblwrap"><table class="tbl"><thead><tr><th>客户端</th><th>上行</th><th>下行</th><th>合计</th><th>用量</th></tr></thead><tbody id="stats_clients_tb">';
    d.clients.forEach(c => {
      const total = (Number(c.up) || 0) + (Number(c.down) || 0);
      const pct = (c.traffic_limit_bytes && c.traffic_limit_bytes > 0) ? Math.min(100, (total / c.traffic_limit_bytes) * 100) : 0;
      const usage = '<div class="bar"><span style="width:' + pct.toFixed(1) + '%"></span></div>' + pct.toFixed(1) + '%';
      h += '<tr><td>' + esc(c.alias || ('#' + c.client_id)) + '</td><td>' + fmtBytes(c.up) + '</td><td>' + fmtBytes(c.down) + '</td><td>' + fmtBytes(total) + '</td><td>' + usage + '</td></tr>';

  h += '</div>';
  document.getElementById('main').innerHTML = h;

function filterRows(tbId, q) {

// 在节点端口范围内随机选一个未占用端口（已用端口=该节点已有入站端口）。
// 范围空=返回空（由用户手填）；返回 '' 表示无法生成（范围耗尽）。
function randomPortForNode(nodeId) {
  const n = nodesData.find(x => x.id === nodeId);
  const rng = (n && n.port_range || '').trim();
  if (!rng) return '';
  const used = new Set((inboundsCache[nodeId] || []).map(inb => inb.port));
  const ranges = [];
  for (let part of rng.split(',')) {
    part = part.trim();
    if (!part) continue;
    if (part.includes('-')) {
      const [a, b] = part.split('-').map(Number);
      if (a >= 1 && b <= 65535 && a <= b) ranges.push([a, b]);
    } else {
      const v = Number(part);
      if (v >= 1 && v <= 65535) ranges.push([v, v]);
    }
  }
  const candidates = [];
  for (const [lo, hi] of ranges) for (let p = lo; p <= hi; p++) if (!used.has(p)) candidates.push(p);
  if (!candidates.length) return '';
  return String(candidates[Math.floor(Math.random() * candidates.length)]);
}

// ---- 到期时间转换 ----
function toDTLocal(s) {
  if (!s) return '';
  const d = new Date(s); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromDTLocal(s) { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return d.toISOString(); }
// 月流量上限单位换算：MB=1024^2, GB=1024^3, TB=1024^4
function trafficUnitMul(u) { return { mb: 1048576, gb: 1073741824, tb: 1099511627776 }[u] || 1073741824; }
// 把字节值拆成「数值+合适单位」：取第一个 b>=mul 的最大单位，否则按 MB 显示小数
function trafficParts(b) {
  b = Number(b) || 0;
  if (b <= 0) return { v: 0, unit: 'gb' };
  for (const [u, mul] of [['tb', 1099511627776], ['gb', 1073741824], ['mb', 1048576]]) {
    if (b >= mul) return { v: Math.round(b / mul * 1000) / 1000, unit: u };
  }
  return { v: Math.round(b / 1048576 * 1000) / 1000, unit: 'mb' };
}
// 月流量单位下拉（MB/GB/TB）
function unitSelect(sel) {
  return '<select id="n_mtraffic_unit" style="width:auto;flex:0 0 auto;padding:9px 8px">' +
    [['mb', 'MB'], ['gb', 'GB'], ['tb', 'TB']]
      .map(x => '<option value="' + x[0] + '"' + (x[0] === sel ? ' selected' : '') + '>' + x[1] + '</option>')
      .join('') + '</select>';
}
// 人类可读字节数（前端版）
function fmtBytesJS(b) {
  b = Number(b) || 0;
  const u = 1024;
  if (b < u) return b + ' B';
  const units = ['KB', 'MB', 'GB', 'TB', 'PB'];
  let i = -1, n = b;
  do { n /= u; i++; } while (n >= u && i < units.length - 1);
  return n.toFixed(2) + ' ' + units[i];
}

// 端口范围严格校验：空=用全局默认；非空须为 逗号分隔的 "N" 或 "N-M"，每段端口 1-65535 且 lo<=hi
function validPortRange(s) {
  s = (s || '').trim();
  if (!s) return true;
  if (!/^\d+(-\d+)?(,\d+(-\d+)?)*$/.test(s)) return false;
  for (const p of s.split(',')) {
    if (p.includes('-')) {
      const [a, b] = p.split('-').map(Number);
      if (a < 1 || b > 65535 || a > b) return false;
    } else {
      const v = Number(p);
      if (v < 1 || v > 65535) return false;
    }
  }
  return true;
}
async function doCreateNode() {
  const pr = (val('m_n_pr') || '').trim();
  if (!validPortRange(pr)) return showToast('端口范围格式不正确（如 10000-20000,30000-40000）', 'err');
  const rawRegion = val('m_n_region');
  const region = (rawRegion && !rawRegion.includes('识别') && !rawRegion.includes('失败')) ? val('m_n_country') : '';
  const d = await api('POST', '/nodes', { name: val('m_n_name'), address: val('m_n_addr'), region: region, city: val('m_n_city'), port_range: pr });
  if (d) { closeModal(); showToast('节点已注册', 'ok'); copyText(d.token); await loadNodes(); }

    // 同步填充按节点分组的侧边栏缓存，展开节点时立即可显示入站
    inboundsCache = {};
    v.forEach(inb => { (inboundsCache[inb.node_id] = inboundsCache[inb.node_id] || []).push(inb); });
    renderSidebar();
    // 后台预加载各入站客户端，展开入站时立即可显示（不阻塞当前渲染）
    v.forEach(inb => { ensureClients(inb.id); });
  }
}

function enterApp() {
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerRight').classList.remove('hidden');
  document.getElementById('who').textContent = 'admin';
  document.getElementById('autoSyncChk').checked = autoSync;
  renderSidebar(); renderWelcome();
  loadNodes(); loadSubs(); loadCerts(); loadNotifiers(); loadAllInbounds();
  if (refreshTimer) clearInterval(refreshTimer);
  if (!MUST_CHANGE_PWD) refreshTimer = setInterval(loadNodes, 30000);
}

if (token) enterApp();
else { document.getElementById('loginWrap').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
</script>
</body>
