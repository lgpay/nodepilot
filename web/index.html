<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodePilot 控制台</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e6e9ee; --text: #1c1f26; --muted: #7c8494;
    --primary: #2563eb; --primary-strong: #1d4ed8; --primary-soft: #eaf1fe;
    --danger: #dc2626; --danger-strong: #b91c1c; --danger-soft: #fdecec;
    --ok: #16a34a; --ok-soft: #e9f6ee; --warn: #d97706; --warn-soft: #fdf3e5;
    --header-bg: #ffffff; --header-fg: #1c1f26; --header-accent: #2563eb;
    --sidebar-bg: #ffffff; --sidebar-fg: #4b5563; --sidebar-hover: #f3f5f8; --sidebar-act: #eaf1fe;
    --input-bg: #ffffff; --input-border: #d8dce3; --input-dis: #f2f3f5;
    --code-bg: #f3f5f8; --code-fg: #3f4754;
    --shadow: 0 1px 3px rgba(16,24,40,.07);
    --shadow-lg: 0 12px 32px rgba(16,24,40,.15);
    --radius: 10px; --radius-sm: 6px; --radius-pill: 999px;
    --maxw: 1180px;
  }
  [data-theme="dark"] {
    --bg: #0f1116; --card: #171a21; --border: #262c38; --text: #e6eaf1; --muted: #8b94a6;
    --primary: #3b82f6; --primary-strong: #60a5fa; --primary-soft: #1a2740;
    --danger: #f87171; --danger-strong: #fca5a5; --danger-soft: #3a2226;
    --ok: #4ade80; --ok-soft: #142b1d; --warn: #fbbf24; --warn-soft: #332912;
    --header-bg: #0d0f14; --header-fg: #e6eaf1; --header-accent: #3b82f6;
    --sidebar-bg: #0d0f14; --sidebar-fg: #a0a9ba; --sidebar-hover: #1a1e28; --sidebar-act: #1a2740;
    --input-bg: #13161d; --input-border: #2c3340; --input-dis: #1a1d25;
    --code-bg: #0d0f14; --code-fg: #7ee787;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: var(--primary); }

  header { background: var(--header-bg); color: var(--header-fg); padding: 0 18px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; border-bottom: 1px solid var(--border); z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 6px; display: block; object-fit: contain; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; }
  header .right { display: flex; align-items: center; gap: 9px; }
  header .right .chk { color: var(--header-fg); }
  header .right button { color: var(--header-fg); border-color: var(--input-border); }
  header .right button:hover { background: var(--sidebar-hover); border-color: var(--muted); color: var(--header-fg); }
  .burger { display: none; background: transparent; color: var(--header-fg); border: 0; font-size: 20px; cursor: pointer; padding: 0 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card > h2:first-child, .card > h3:first-child { margin-top: 0; }
  .card h2 { font-size: 15px; margin: 0 0 16px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
  .card h3 { font-size: 13px; margin: 18px 0 10px; color: var(--muted); font-weight: 600; }
  .card h3:first-child { margin-top: 0; }
  label { display: block; font-size: 12.5px; margin: 12px 0 5px; color: var(--muted); font-weight: 500; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--input-border); border-radius: var(--radius-sm); background: var(--input-bg); color: var(--text); font-size: 13px; transition: border-color .15s, box-shadow .15s; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  input:disabled { background: var(--input-dis); color: var(--muted); cursor: default; }
  button { background: var(--primary); color: #fff; border: 0; padding: 9px 18px; border-radius: var(--radius-sm); cursor: pointer; margin-top: 12px; font-size: 13px; font-weight: 600; transition: background .15s, opacity .15s, transform .08s, box-shadow .15s; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  button:hover { background: var(--primary-strong); box-shadow: 0 2px 6px rgba(16,24,40,.12); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--input-border); box-shadow: none; }
  button.secondary:hover { background: var(--bg); border-color: var(--muted); box-shadow: none; }
  [data-theme="dark"] button.secondary { color: var(--text); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-strong); }
  button.small { padding: 5px 12px; font-size: 12px; margin-top: 0; box-shadow: none; }
  button.sm { padding: 2px 9px; font-size: 11px; margin: 0 0 0 6px; box-shadow: none; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .btnrow button { margin-top: 0; }
  .chk { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
  .chk input { width: auto; margin: 0; accent-color: var(--primary); }
  .mbar { width: 100%; height: 10px; border-radius: var(--radius-pill); background: var(--input-border); overflow: hidden; }
  .mbar-fill { height: 100%; border-radius: var(--radius-pill); background: var(--primary); transition: width .4s ease; }
  .mbar-fill.warn { background: var(--warn); }
  .mbar-fill.danger { background: var(--danger); }
  .inblist { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--bg); display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 16px; align-items: start; }
  .inblist .chk { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .inblist .chk span, .inblist .chk b { white-space: nowrap; }
  .inblist .chk b { color: var(--text); font-weight: 600; }
  .subinb { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .subcli { display: flex; flex-wrap: wrap; gap: 2px 12px; padding-left: 22px; }
  .subcli .chk { font-size: 12px; color: var(--muted); }
  .qr { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .qr img { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; padding: 6px; }
  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; min-width: 0; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }

  .tblwrap { overflow: auto; max-height: 460px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .tbl tbody tr { transition: background .12s; }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .tbl tbody tr:hover { background: var(--primary-soft); }
  [data-theme="dark"] .tbl tbody tr:hover { background: rgba(59,130,246,.12); }
  .search { margin-bottom: 10px; max-width: 280px; }
  .list-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 10px; }
  .list-toolbar .search { margin:0; flex:1; }
  .list-count { color:var(--muted); font:500 10px/1 "JetBrains Mono",Consolas,monospace; white-space:nowrap; }
  .detail-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .detail-head .crumb { margin:0; min-width:0; }
  .detail-head .btnrow { margin:0; }
  .back-btn { padding:5px 10px; min-width:auto; }
  .filtered-empty { display:none; padding:20px; color:var(--muted); text-align:center; font-size:12px; }
  .deploy-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
  .deploy-summary > div { padding:10px; border:1px solid var(--border); background:var(--bg); text-align:center; }
  .deploy-summary b { display:block; font:600 20px/1.2 "JetBrains Mono",Consolas,monospace; }
  .deploy-list { max-height:360px; overflow:auto; border:1px solid var(--border); }
  .deploy-row { display:grid; grid-template-columns:minmax(120px,1fr) 90px minmax(160px,1.3fr); gap:10px; align-items:center; padding:9px 10px; border-bottom:1px solid var(--border); font-size:12px; }
  .deploy-row:last-child { border-bottom:0; }
  .deploy-error { color:var(--danger); white-space:normal; word-break:break-word; }

  pre { background: var(--code-bg); color: var(--code-fg); padding: 14px; border-radius: var(--radius-sm); overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 420px; }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 9px; background: #eef2f7; color: #475569; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; }
  [data-theme="dark"] .badge { background: #263041; color: #b6c2d4; }
  .badge.blue { background: var(--primary-soft); color: var(--primary-strong); }
  [data-theme="dark"] .badge.blue { color: #93c5fd; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 600; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.off { background: var(--danger-soft); color: var(--danger); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.neutral { background: var(--primary-soft); color: var(--primary-strong); }
  .ok { color: var(--ok); } .off { color: var(--danger); } .warn { color: var(--warn); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .link { color: var(--primary); word-break: break-all; }

  #app { flex: 1 1 auto; display: flex; min-height: 0; }
  .sidebar { width: 280px; flex: 0 0 auto; background: var(--sidebar-bg); color: var(--sidebar-fg); overflow-y: auto; padding: 12px 10px 24px; border-right: 1px solid var(--border); }
  .main { flex: 1 1 auto; overflow-y: auto; padding: 22px 26px; }
  @media (min-width: 1300px) { .main { max-width: var(--maxw); margin: 0 auto; width: 100%; } }
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 400px; margin: 0; border-radius: var(--radius); }
  .login-card .brand { justify-content: center; margin-bottom: 12px; }
  .login-logo { width: 220px; max-width: 80%; height: auto; display: block; }

  .sb-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 16px 8px 6px; text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
  .sb-head:first-child { margin-top: 4px; }
  .sb-head .sm { background: transparent; color: var(--sidebar-fg); border: 1px solid var(--input-border); margin: 0 0 0 6px; }
  .sb-head .sm:hover { background: var(--sidebar-hover); color: var(--text); }
  .ti { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--sidebar-fg); transition: background .12s, color .12s; position: relative; }
  .ti:hover { background: var(--sidebar-hover); color: var(--text); }
  .ti.active { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; }
  .ti.active .muted { color: var(--primary); }
  .ti .caret { width: 14px; text-align: center; color: var(--muted); user-select: none; flex: 0 0 auto; }
  .ti.active .caret { color: var(--primary); }
  .ti .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti.indent { padding-left: 30px; }
  .ti.indent2 { padding-left: 52px; }
  .ti.leaf { padding-left: 30px; cursor: default; color: var(--muted); }
  .ti.leaf2 { padding-left: 52px; cursor: default; color: var(--muted); }
  .ti.leaf:hover { background: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--danger); } .dot.warn { background: var(--warn); }

  .crumb { font-size: 14px; margin-bottom: 16px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .crumb b { color: var(--text); }

  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8,11,18,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow: auto; animation: fade .15s ease; }
  .modal.hidden { display: none; }
  .modalcard { width: 460px; max-width: 100%; max-height: calc(100vh - 40px); overflow-y: auto; margin: 0; box-shadow: var(--shadow-lg); border-radius: var(--radius); animation: pop .18s ease; }
  .modalcard.wide { width: 720px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(8px); background: var(--header-bg); color: var(--header-fg); padding: 11px 20px; border-radius: 10px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 1100; font-size: 13px; max-width: 84vw; box-shadow: var(--shadow-lg); font-weight: 500; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--ok); color: #fff; }
  .toast.err { background: var(--danger); color: #fff; }
  .toast.warn { background: var(--warn); color: #fff; }

  /* 强制改密横幅 */
  .banner { display: flex; align-items: center; gap: 12px; background: var(--warn-soft); color: #92600a;
    border-bottom: 1px solid #f3d28a; padding: 11px 20px; font-size: 13.5px; }
  [data-theme="dark"] .banner { background: #332a14; color: #ffd98a; border-bottom-color: #5a4a1a; }
  .banner.hidden { display: none; }
  .banner .grow { flex: 1; }
  .banner b { color: var(--danger); }

  .kpis { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .kpi { flex: 1; min-width: 140px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
  .kv { font-size: 26px; font-weight: 750; color: var(--text); letter-spacing: -.5px; }
  .kl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .bar { display: inline-block; width: 90px; height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
  .bar span { display: block; height: 100%; background: var(--primary); }
  .barchart { display: grid; grid-template-columns: repeat(var(--bar-count, 30), minmax(0, 1fr)); align-items: end; gap: clamp(1px, .3vw, 4px); width: 100%; height: 220px; margin-top: 8px; overflow: hidden; padding-bottom: 4px; }
  .bcol { min-width: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; overflow: visible; }
  .bval { display: none; }
  .bar-v { width: min(70%, 30px); min-width: 2px; height: 180px; background: var(--border); border-radius: 4px 4px 0 0; overflow: hidden; display: flex; align-items: flex-end; }
  .bar-v span { display: block; width: 100%; background: var(--primary); border-radius: 4px 4px 0 0; }
  .bdate { width: 100%; height: 14px; overflow: visible; font-size: 9px; color: transparent; margin-top: 4px; white-space: nowrap; text-align: center; }
  .bcol:nth-child(5n + 1) .bdate, .bcol:last-child .bdate { color: var(--muted); }

  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .qcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .14s; }
  .qcard:hover { border-color: var(--primary); }
  .qcard .ic { font-size: 28px; }
  .qcard .tt { font-weight: 650; margin-top: 10px; }
  .qcard .ds { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

  details.adv { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 10px; background: var(--bg); }
  details.adv summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details.adv[open] summary { margin-bottom: 8px; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 40px 0; justify-content: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 13px; }
  .empty .em-ic { font-size: 30px; opacity: .5; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 滚动条 */
  .sidebar::-webkit-scrollbar, .main::-webkit-scrollbar, .tblwrap::-webkit-scrollbar, .modalcard::-webkit-scrollbar, pre::-webkit-scrollbar { width: 9px; height: 9px; }
  .sidebar::-webkit-scrollbar-thumb, .main::-webkit-scrollbar-thumb, .tblwrap::-webkit-scrollbar-thumb, .modalcard::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb { background: rgba(120,130,150,.35); border-radius: 8px; }
  .sidebar::-webkit-scrollbar-thumb:hover, .main::-webkit-scrollbar-thumb:hover { background: rgba(120,130,150,.55); }

  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 56px; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s; width: 264px; box-shadow: var(--shadow-lg); }
    .sidebar.open { transform: translateX(0); }
    .burger { display: block; }
    .main { padding: 14px; }
    .row { flex-direction: column; }
  }
  @media (max-width: 560px) {
    .tblwrap { overflow-x: auto; }
    .tbl { min-width: 560px; }
    .card { padding: 16px; }
  }

  /* Stitch / Obsidian Telemetry visual system */
  :root {
    --bg: #090d16; --card: #0f172a; --border: rgba(255,255,255,.08); --text: #dfe2ef; --muted: #7f8da3;
    --primary: #06b6d4; --primary-strong: #4cd7f6; --primary-soft: rgba(6,182,212,.11);
    --danger: #ef4444; --danger-strong: #ff6b6b; --danger-soft: rgba(239,68,68,.11);
    --ok: #10b981; --ok-soft: rgba(16,185,129,.11); --warn: #f59e0b; --warn-soft: rgba(245,158,11,.11);
    --header-bg: #090d16; --header-fg: #dfe2ef; --header-accent: #06b6d4;
    --sidebar-bg: #080c14; --sidebar-fg: #94a3b8; --sidebar-hover: #121b2c; --sidebar-act: rgba(6,182,212,.12);
    --input-bg: #090d16; --input-border: rgba(255,255,255,.12); --input-dis: #121925;
    --code-bg: #05080e; --code-fg: #6ee7b7; --shadow: none; --shadow-lg: 0 16px 48px rgba(0,0,0,.65);
    --radius: 4px; --radius-sm: 4px; --maxw: 1720px;
  }
  [data-theme="light"] {
    --bg:#eef3f7;--card:#fff;--border:#d9e1e8;--text:#172033;--muted:#68758a;
    --header-bg:#fff;--header-fg:#172033;--sidebar-bg:#f7fafc;--sidebar-fg:#536176;
    --sidebar-hover:#edf3f7;--sidebar-act:#dff7fb;--input-bg:#fff;--input-border:#cdd7e0;--input-dis:#eef2f5;
    --code-bg:#101827;--code-fg:#6ee7b7;
  }
  body { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: .01em; }
  header { height: 58px; padding: 0 18px; border-color: var(--border); }
  header::after { content:""; position:absolute; left:0; right:0; top:57px; height:1px; background:linear-gradient(90deg,transparent,var(--primary),transparent); opacity:.22; }
  header h1 { font-size: 14px; letter-spacing: .04em; }
  .brand .logo { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(6,182,212,.25)); }
  .ops-strip { display:flex; align-items:center; gap:14px; margin-left:22px; font-family:"JetBrains Mono",Consolas,monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .ops-strip b { color:var(--ok); font-weight:600; }
  .ops-strip i { width:5px; height:5px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); display:inline-block; margin-right:5px; }
  .sidebar { width:220px; padding:10px 10px 20px; border-color:var(--border); }
  .main { padding:22px 24px 48px; max-width:var(--maxw); width:0; min-width:0; margin:0 auto; }
  .sb-logo { padding:10px 10px 14px; margin-bottom:6px; border-bottom:1px solid var(--border); }
  .sb-kicker,.eyebrow { font:600 9px/1.2 "JetBrains Mono",Consolas,monospace; color:var(--primary); letter-spacing:.09em; text-transform:uppercase; }
  .sb-title { font-size:11px; margin-top:5px; color:var(--muted); }
  .sb-head { margin:18px 9px 6px; font:600 9px/1.2 "JetBrains Mono",Consolas,monospace; letter-spacing:.1em; }
  .ti { min-height:36px; padding:8px 10px; border-radius:3px; gap:9px; font-size:12px; border-left:2px solid transparent; }
  .ti.active { border-left-color:var(--primary); background:var(--primary-soft); color:var(--primary-strong); }
  .ti .nav-ic { width:17px; text-align:center; font:600 12px/1 "JetBrains Mono",Consolas,monospace; color:var(--muted); }
  .ti.active .nav-ic { color:var(--primary); }
  .nav-count { margin-left:auto; min-width:24px; text-align:center; padding:1px 5px; border:1px solid var(--border); border-radius:2px; font:600 9px/1.4 "JetBrains Mono",Consolas,monospace; color:var(--ok); }
  .sidebar-foot { margin:22px 9px 0; padding-top:13px; border-top:1px solid var(--border); font:500 9px/1.8 "JetBrains Mono",Consolas,monospace; color:var(--muted); }
  .sidebar-foot b { color:var(--ok); }
  .account-toggle { display:none; margin:0; padding:6px 9px; }
  .empty.compact { padding:25px 12px; }
  .subtle-note { padding:9px 11px; border:1px solid var(--border); background:var(--bg); color:var(--muted); font-size:12px; border-radius:3px; }
  .settings-grid { display:grid; grid-template-columns:repeat(2,minmax(260px,1fr)); gap:12px; }
  .card { padding:14px 16px; margin-bottom:12px; border-radius:4px; box-shadow:none; }
  .card:hover { border-color:rgba(6,182,212,.18); }
  .card h2 { font-size:13px; margin-bottom:13px; }
  .card h2::before { content:""; width:3px; height:14px; background:var(--primary); box-shadow:0 0 9px rgba(6,182,212,.45); }
  button { color:#031216; border-radius:3px; box-shadow:none; text-transform:none; }
  button:hover { box-shadow:0 0 14px rgba(6,182,212,.18); }
  button.secondary { color:var(--text); border-color:var(--border); }
  button.danger { color:#fecaca; background:var(--danger-soft); border:1px solid rgba(239,68,68,.45); }
  input,select,textarea { border-radius:3px; font-family:inherit; }
  input[type="text"],input[type="number"],input[type="datetime-local"],textarea,pre,.tbl td { font-variant-numeric:tabular-nums; }
  .tblwrap { border-radius:3px; max-height:560px; }
  .tbl th,.tbl td { height:38px; padding:8px 10px; }
  .tbl th { background:#0c1320; font:600 9px/1 "JetBrains Mono",Consolas,monospace; letter-spacing:.08em; }
  [data-theme="light"] .tbl th { background:#f2f6f9; }
  .tbl tbody tr:hover { background:var(--primary-soft); box-shadow:inset 2px 0 var(--primary); }
  .pill,.badge { height:19px; border-radius:2px; font:600 9px/1 "JetBrains Mono",Consolas,monospace; letter-spacing:.04em; text-transform:uppercase; }
  .pill::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; box-shadow:0 0 7px currentColor; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin:0 0 18px; }
  .page-head h1 { font-size:25px; line-height:1.1; margin:5px 0 0; letter-spacing:-.025em; }
  .page-head p { margin:6px 0 0; color:var(--muted); font-size:12px; }
  .page-head .btnrow { margin:0; }
  .telemetry-grid { display:grid; grid-template-columns:repeat(4,minmax(160px,1fr)); gap:10px; margin-bottom:12px; }
  .telemetry-grid.compact { grid-template-columns:repeat(3,minmax(160px,1fr)); }
  .telemetry { background:var(--card); border:1px solid var(--border); border-radius:4px; padding:13px 14px; min-height:102px; position:relative; overflow:hidden; }
  .telemetry::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:linear-gradient(90deg,var(--primary),transparent 75%); opacity:.75; }
  .telemetry.green::after{background:linear-gradient(90deg,var(--ok),transparent 75%)} .telemetry.amber::after{background:linear-gradient(90deg,var(--warn),transparent 75%)}
  .telemetry .t-label { font:600 9px/1.3 "JetBrains Mono",Consolas,monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .telemetry .t-value { font:600 25px/1.1 "JetBrains Mono",Consolas,monospace; margin-top:13px; }
  .telemetry .t-value small { font-size:10px; color:var(--muted); font-weight:500; }
  .telemetry .t-note { margin-top:7px; font:500 9px/1 "JetBrains Mono",Consolas,monospace; color:var(--ok); }
  .dash-grid { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(280px,.85fr); gap:12px; }
  .dash-stack { display:grid; gap:12px; align-content:start; }
  .spark { height:120px; display:flex; align-items:flex-end; gap:4px; padding:12px 3px 4px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,transparent,rgba(6,182,212,.035)); }
  .spark span { flex:1; min-width:3px; background:linear-gradient(180deg,var(--primary),rgba(6,182,212,.12)); border-radius:1px 1px 0 0; opacity:.82; }
  .fleet-row { display:grid; grid-template-columns:minmax(140px,1.4fr) 72px minmax(155px,1fr) 88px 76px; align-items:center; gap:10px; min-height:42px; padding:6px 2px; border-bottom:1px solid var(--border); font-size:11px; }
  .fleet-row:last-child{border-bottom:0}.fleet-row code{font-size:10px;color:var(--muted)}
  .fleet-row .node-region { display:block; margin-top:2px; font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .world-map { position:relative; width:100%; aspect-ratio:2/1; min-height:220px; overflow:hidden; background:radial-gradient(circle at 50% 42%,rgba(6,182,212,.07),transparent 62%),var(--bg); border:1px solid var(--border); }
  .world-map svg { display:block; width:100%; height:100%; }
  .world-map .map-land { fill:rgba(127,141,163,.18); stroke:rgba(127,141,163,.42); stroke-width:.7; vector-effect:non-scaling-stroke; }
  .world-map .map-grid { fill:none; stroke:rgba(127,141,163,.13); stroke-width:.55; vector-effect:non-scaling-stroke; }
  .map-marker { cursor:pointer; }
  .map-marker .map-halo { opacity:.2; transform-box:fill-box; transform-origin:center; animation:mapPulse 2.4s ease-out infinite; }
  .map-marker .map-dot { stroke:var(--card); stroke-width:2; vector-effect:non-scaling-stroke; }
  .map-marker.online .map-dot,.map-marker.online .map-halo{fill:var(--ok)}
  .map-marker.offline .map-dot,.map-marker.offline .map-halo{fill:var(--danger)}
  .map-marker.mixed .map-dot,.map-marker.mixed .map-halo{fill:var(--warn)}
  .map-marker text { fill:var(--text); font:600 10px/1 "JetBrains Mono",Consolas,monospace; text-anchor:middle; pointer-events:none; }
  .map-legend { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-top:9px; color:var(--muted); font-size:11px; }
  .map-legend .key { display:inline-flex; align-items:center; gap:5px; }
  .map-legend .swatch { width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 7px currentColor; }
  .map-legend .swatch.offline{background:var(--danger)} .map-legend .swatch.mixed{background:var(--warn)}
  .map-unlocated { margin-left:auto; }
  /* 提升辅助信息可读性，避免深色控制台中字号过小。 */
  .sb-title { font-size:12px; }
  .sb-head,.sb-kicker,.eyebrow { font-size:12px; line-height:1.5; }
  .sidebar-foot { font-size:12px; }
  .ti { font-size:14px; }
  .nav-count,.ops-strip { font-size:12px; }
  .card h2 { font-size:15px; }
  .page-head p { font-size:13px; }
  .telemetry .t-label { font-size:12px; }
  .telemetry .t-note { font-size:12px; line-height:1.5; }
  .list-count { font-size:11px; }
  .fleet-row { font-size:12px; }
  .fleet-row code,.fleet-row .node-region { font-size:12px; }
  .fleet-row > span:first-child { min-width:0; overflow-wrap:anywhere; }
  .resource-card code,.topology-node { font-size:12px; }
  .map-legend { font-size:12px; }
  .subtle-note { font-size:13px; }
  .tbl th { font-size:12px; line-height:1.4; }
  .pill,.badge { font-size:12px; height:auto; min-height:23px; line-height:1.4; }
  @keyframes mapPulse { 0%{transform:scale(.9);opacity:.3} 70%,100%{transform:scale(2.2);opacity:0} }
  .resource-grid { display:grid; grid-template-columns:repeat(3,minmax(220px,1fr)); gap:10px; }
  .resource-card { background:var(--card); border:1px solid var(--border); border-top:2px solid var(--primary); padding:14px; border-radius:3px; }
  .resource-card h3 { margin:0 0 4px; color:var(--text); font-size:13px; }.resource-card code{font-size:10px;color:var(--muted)}
  .resource-card .btnrow{margin-top:13px}.section-gap{margin-top:12px}
  .topology { display:flex; align-items:center; justify-content:center; gap:8px; min-height:108px; overflow:auto; }
  .topology-node { border:1px solid var(--border); background:var(--bg); padding:10px 12px; min-width:92px; text-align:center; font:600 10px/1.5 "JetBrains Mono",Consolas,monospace; }
  .topology-line { width:32px; height:1px; background:var(--primary); box-shadow:0 0 6px var(--primary); }
  .login-wrap { background:radial-gradient(circle at 50% 15%,rgba(6,182,212,.09),transparent 38%),var(--bg); }
  .login-card { max-width:390px; padding:28px; border-color:rgba(6,182,212,.2); }
  .modal { backdrop-filter:blur(8px); background:rgba(3,7,14,.72); }
  @media(max-width:1100px){.telemetry-grid,.telemetry-grid.compact{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.resource-grid{grid-template-columns:repeat(2,1fr)}.ops-strip{display:none}}
  @media(max-width:700px){.account-toggle{display:block}header .right{display:none!important;position:absolute;right:10px;top:52px;z-index:80;width:210px;padding:12px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-lg);flex-direction:column;align-items:stretch}header .right.mobile-open{display:flex!important}header .right .chk{padding:8px 2px}header .right button{width:100%;margin:0}.telemetry-grid,.telemetry-grid.compact,.resource-grid,.settings-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.detail-head{align-items:flex-start;flex-direction:column}.fleet-row{grid-template-columns:1fr 70px 60px}.fleet-row>:nth-child(3),.fleet-row>:nth-child(4){display:none}.sidebar{top:58px}.main{padding:15px}.list-toolbar{align-items:stretch;flex-direction:column}.list-toolbar .search{max-width:none}.deploy-row{grid-template-columns:1fr 80px}.deploy-row>:last-child{grid-column:1/-1}.deploy-summary{grid-template-columns:1fr}.world-map{min-height:170px}.map-unlocated{width:100%;margin-left:0}}
  @media(prefers-reduced-motion:reduce){.map-marker .map-halo{animation:none}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <button class="burger" id="burgerBtn" onclick="toggleSidebar()">☰</button>
    <img class="logo" src="logo.png" alt="NodePilot">
    <h1>NodePilot 控制台</h1>
    <div class="ops-strip"><span><i></i>管理端已连接</span><span>最近更新：<b id="refreshStatus">等待数据</b></span><span>在线节点：<b id="hbStatus">--/--</b></span><span>待下发：<b id="deployStatus">0</b></span></div>
  </div>
  <button class="secondary small account-toggle hidden" id="accountToggle" onclick="toggleAccountMenu()" aria-label="账号与设置">账户</button>
  <div id="headerRight" class="right hidden">
    <label class="chk"><input type="checkbox" id="autoSyncChk" onchange="setAutoSync(this.checked)"> 自动下发</label>
    <button class="secondary small" id="darkBtn" onclick="toggleDark()">🌙 暗色</button>
    <span id="who" class="muted"></span>
    <button class="secondary small" onclick="showChangePw()">修改密码</button>
    <button class="secondary small" onclick="logout()">退出</button>
  </div>
</header>

<div id="pwBanner" class="banner hidden">
  <span class="grow">⚠ <b>初始密码：</b>请立即修改管理员密码。</span>
  <button onclick="showChangePw(true)">去修改</button>
</div>

<div id="loginWrap" class="login-wrap hidden">
  <div id="login" class="card login-card">
    <div class="brand"><img class="login-logo" src="lockup.png" alt="NodePilot"></div>
    <h2 style="text-align:center">登录控制台</h2>
    <label>用户名</label><input id="user" value="admin" onkeydown="if(event.key==='Enter')login()">
    <label>密码</label><input id="pass" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" style="width:100%">登录</button>
    <span id="loginMsg" class="muted"></span>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="main" class="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="card modalcard" id="modalBody"></div></div>
<div id="confirmLayer" class="modal hidden" style="z-index:1200"><div class="card modalcard" id="confirmBody"></div></div>
<div id="toast" class="toast"></div>

<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<script>
const API = '/api/v1';
let token = localStorage.getItem('np_token') || '';
let sel = { type: null, id: null, parentId: null };
let nodesData = [];
let inboundsCache = {};   // nodeId -> [inbound]
let clientsCache = {};    // inboundId -> [client]
let subsData = [];
let certsData = [];
let notifData = [];
let inboundCatalog = [];
let subFiltersBase = ''; // 当前订阅已有的 filters JSON(合并基础,避免保存时丢失)
let installCmdCache = ''; // 当前节点接入命令缓存(复制按钮用)
let currentNotifType = 'email';
let autoSync = localStorage.getItem('np_autosync') === '1';
const savedTheme = localStorage.getItem('np_dark');
let dark = savedTheme === null ? true : savedTheme === '1';
let refreshTimer = null;
let confirmRes = null;
let refreshMainAfterClose = false; // 关闭弹窗后需刷新当前视图(客户端增删后)
let statsData = null;
let settingsData = null;
let deployState = {};
try { deployState = JSON.parse(sessionStorage.getItem('np_deploy_state') || '{}') || {}; } catch (e) { deployState = {}; }
let failedDeployNodeIds = [];
let batchDeployRunning = false;
let routeEpoch = 0;
let activeRouteKey = '';
let appReady = false;
let pageStates = {};
try { pageStates = JSON.parse(sessionStorage.getItem('np_page_states') || '{}') || {}; } catch (e) { pageStates = {}; }

function routeKey() { return (location.hash || '#/overview').replace(/^#/, ''); }
function pageState() { return pageStates[activeRouteKey || routeKey()] || {}; }
function persistPageStates() { sessionStorage.setItem('np_page_states', JSON.stringify(pageStates)); }
function rememberPageState(patch) {
  const key = activeRouteKey || routeKey();
  pageStates[key] = { ...(pageStates[key] || {}), ...patch };
  persistPageStates();
}
function capturePageState() {
  if (!activeRouteKey) return;
  const main = document.getElementById('main');
  pageStates[activeRouteKey] = { ...(pageStates[activeRouteKey] || {}), scrollTop: main ? main.scrollTop : 0 };
  persistPageStates();
}
function restorePageState(epoch) {
  requestAnimationFrame(() => {
    if (epoch !== routeEpoch) return;
    const main = document.getElementById('main');
    if (main) main.scrollTop = +(pageState().scrollTop || 0);
  });
}
function listToolbar(id, placeholder, count) {
  const q = (pageState().queries || {})[id] || '';
  return '<div class="list-toolbar"><input class="search" value="' + esc(q) + '" placeholder="' + esc(placeholder) + '" oninput="filterList(\'' + id + '\',this.value)"><span class="list-count">' + count + ' 项</span></div>';
}
function filterList(id, q) {
  q = (q || '').trim().toLowerCase();
  const queries = { ...(pageState().queries || {}), [id]: q };
  rememberPageState({ queries });
  const root = document.querySelector('[data-list="' + id + '"]');
  if (!root) return;
  let visible = 0;
  root.querySelectorAll('[data-search-row]').forEach(row => {
    const show = !q || row.textContent.toLowerCase().includes(q);
    row.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  const empty = document.querySelector('[data-filter-empty="' + id + '"]');
  if (empty) empty.style.display = visible ? 'none' : 'block';
}
function restoreListFilter(id) { const q = (pageState().queries || {})[id] || ''; if (q) requestAnimationFrame(() => filterList(id, q)); }
function detailHead(parentLabel, currentLabel, backRoute, status) {
  return '<div class="detail-head"><div class="crumb">' + esc(parentLabel) + ' / <b>' + esc(currentLabel) + '</b> ' + (status || '') + '</div><div class="btnrow"><button class="secondary small back-btn" onclick="navigate(\'' + backRoute + '\')">← 返回列表</button></div></div>';
}
function persistDeployState() {
  sessionStorage.setItem('np_deploy_state', JSON.stringify(deployState));
  const el = document.getElementById('deployStatus');
  if (el) el.textContent = Object.values(deployState).filter(x => x && x.pending).length;
}
function markDeployPending(nodeId, reason) {
  if (!nodeId) return;
  deployState[nodeId] = { pending:true, reason:reason || '配置已修改', changedAt:new Date().toISOString() };
  persistDeployState();
}
function clearDeployPending(nodeId, version) {
  deployState[nodeId] = { pending:false, version:version || null, appliedAt:new Date().toISOString() };
  persistDeployState();
}
function deployPill(nodeId) {
  const s = deployState[nodeId];
  if (s && s.pending) return '<span class="pill warn" title="当前浏览器记录：' + esc(s.reason || '配置已修改') + '">待下发</span>';
  if (s && s.appliedAt) return '<span class="pill ok" title="本次会话最近成功下发' + (s.version ? ' v' + s.version : '') + '">已下发</span>';
  return '<span class="pill neutral" title="当前浏览器尚无保存或下发记录">未记录</span>';
}
async function afterConfigSaved(nodeId, label) {
  if (!nodeId) { showToast(label + '已保存', 'ok'); return null; }
  markDeployPending(nodeId, label + '已修改');
  if (!autoSync) { showToast(label + '已保存，待下发', 'warn'); return null; }
  const d = await syncNode(nodeId, { refresh:false, quiet:true });
  if (d) showToast(label + '已保存并下发', 'ok');
  else showToast(label + '已保存，但下发失败', 'err');
  return d;
}
async function afterInboundSaved(nodeId, label, deployment) {
  if (deployment && deployment.attempted) {
    if (deployment.status === 'applied') {
      clearDeployPending(nodeId, deployment.version);
      showToast(label + '已保存并应用' + (deployment.version ? ' · v' + deployment.version : ''), 'ok');
    } else {
      markDeployPending(nodeId, '服务端自动下发失败');
      showToast(label + '已保存，但自动下发失败：' + (deployment.error || '未知错误'), 'err');
    }
    return deployment;
  }
  return afterConfigSaved(nodeId, label);
}

// ---- 主题 ----
function applyTheme() {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const b = document.getElementById('darkBtn'); if (b) b.textContent = dark ? '☀️ 浅色' : '🌙 暗色';
}
function toggleDark() { dark = !dark; localStorage.setItem('np_dark', dark ? '1' : '0'); applyTheme(); }
applyTheme();

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function chk(id) { const e = document.getElementById(id); return e ? e.checked : false; }
function authH() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

// api：非 2xx 统一 toast 服务端 error 并返回 null，避免"失败却提示成功"
async function api(method, path, body) {
  let r;
  try { r = await fetch(API + path, { method, headers: authH(), body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { showToast('网络错误，请检查连接', 'err'); return null; }
  if (r.status === 401 && path !== '/auth/login') {
    showToast('登录已失效，请重新登录');
    forceLogin(); return null;
  }
  const data = await r.json().catch(() => ({}));
  if (r.status === 403 && data.must_change_pwd) {
    showToast(data.error || '请先修改管理员密码', 'err');
    forceChangePw(); return null;
  }
  if (!r.ok) { showToast(data.error || ('请求失败 HTTP ' + r.status), 'err'); return null; }
  const stamp = document.getElementById('refreshStatus');
  if (stamp && path !== '/auth/login') stamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return data;
}

let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(t);
    else { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); if (!ok) throw new Error('copy'); }
    showToast('已复制', 'ok');
  } catch (e) { prompt('复制失败，请手动复制：', t); }
}
async function copySubContent(stoken) {
  try { const r = await fetch(API + '/sub/' + stoken); if (!r.ok) return showToast('获取订阅失败', 'err'); copyText(await r.text()); }
  catch (e) { showToast('复制失败', 'err'); }
}
// 防重复提交：禁用按钮 + "处理中…"，finally 恢复
async function withBusy(btn, fn) {
  if (!btn) return fn();
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '处理中…';
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}

function fmtBytes(b) {
  b = Number(b) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i === 0 ? b : b.toFixed(2)) + ' ' + u[i];
}

function regionLabel(n) {
  if (!n) return '';
  const r = n.region || '', c = n.city || '';
  return (r || c) ? (r + (c ? '·' + c : '')) : '识别中…';

async function detectRegion(id) {
  const n = nodesData.find(x => x.id === id); if (!n || !n.address) return;
  const el = document.getElementById('n_region'); if (el) el.value = regionLabel(n);
  // 已有存库区域：直接使用，不请求外部服务
  if (n.region || n.city) return;
  const d = await api('GET', '/geo?host=' + encodeURIComponent(n.address));
  if (!d) { if (el) el.value = regionLabel(n); return; }
  const name = d.country || d.country_code || '';
  const city = d.city || d.region || '';
  if (el) el.value = (name ? (city ? name + '·' + city : name) : '（识别失败）');
  if (name && (name !== (n.region || '') || city !== (n.city || ''))) {
    const r = await api('PATCH', '/nodes/' + id, { region: name, city: city, latitude: Number(d.latitude) || 0, longitude: Number(d.longitude) || 0 });
    if (r) { await loadNodes(); }
  }
}

async function runBatchDeploy(targets) {

    else { fail++; failedDeployNodeIds.push(n.id); markDeployPending(n.id, '最近一次下发失败'); done[n.id] = { ok:false, error:r.error }; }

  }

  showToast('下发完成：' + ok + ' 成功' + (fail ? '，' + fail + ' 失败' : ''), fail ? (ok ? 'warn' : 'err') : 'ok');
  await loadNodes();

// 在节点端口范围内随机选一个未占用端口（已用端口=该节点已有入站端口）。
// 范围空=返回空（由用户手填）；返回 '' 表示无法生成（范围耗尽）。
function randomPortForNode(nodeId) {
  const n = nodesData.find(x => x.id === nodeId);
  const rng = (n && n.port_range || '').trim();
  if (!rng) return '';
  const used = new Set((inboundsCache[nodeId] || []).map(inb => inb.port));
  const ranges = [];
  for (let part of rng.split(',')) {
    part = part.trim();
    if (!part) continue;
    if (part.includes('-')) {
      const [a, b] = part.split('-').map(Number);
      if (a >= 1 && b <= 65535 && a <= b) ranges.push([a, b]);
    } else {
      const v = Number(part);
      if (v >= 1 && v <= 65535) ranges.push([v, v]);
    }
  }
  const candidates = [];
  for (const [lo, hi] of ranges) for (let p = lo; p <= hi; p++) if (!used.has(p)) candidates.push(p);
  if (!candidates.length) return '';
  return String(candidates[Math.floor(Math.random() * candidates.length)]);
}

// ---- 到期时间转换 ----
function toDTLocal(s) {
  if (!s) return '';
  const d = new Date(s); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromDTLocal(s) { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return d.toISOString(); }
// 月流量上限单位换算：MB=1024^2, GB=1024^3, TB=1024^4
function trafficUnitMul(u) { return { mb: 1048576, gb: 1073741824, tb: 1099511627776 }[u] || 1073741824; }
// 把字节值拆成「数值+合适单位」：取第一个 b>=mul 的最大单位，否则按 MB 显示小数
function trafficParts(b) {
  b = Number(b) || 0;
  if (b <= 0) return { v: 0, unit: 'gb' };
  for (const [u, mul] of [['tb', 1099511627776], ['gb', 1073741824], ['mb', 1048576]]) {
    if (b >= mul) return { v: Math.round(b / mul * 1000) / 1000, unit: u };
  }
  return { v: Math.round(b / 1048576 * 1000) / 1000, unit: 'mb' };
}
// 月流量单位下拉（MB/GB/TB）
function unitSelect(sel) {
  return '<select id="n_mtraffic_unit" style="width:auto;flex:0 0 auto;padding:9px 8px">' +
    [['mb', 'MB'], ['gb', 'GB'], ['tb', 'TB']]
      .map(x => '<option value="' + x[0] + '"' + (x[0] === sel ? ' selected' : '') + '>' + x[1] + '</option>')
      .join('') + '</select>';
}
// 人类可读字节数（前端版）
function fmtBytesJS(b) {
  b = Number(b) || 0;
  const u = 1024;
  if (b < u) return b + ' B';
  const units = ['KB', 'MB', 'GB', 'TB', 'PB'];
  let i = -1, n = b;
  do { n /= u; i++; } while (n >= u && i < units.length - 1);
  return n.toFixed(2) + ' ' + units[i];
}

function toggleInbClients(inbChk, inbId) {
  document.querySelectorAll('input[name=sub_cli][data-inb="' + inbId + '"]').forEach(cb => { cb.checked = inbChk.checked; });
}
// 客户端勾选变化时反向联动入站：该入站客户端全不选 → 入站取消；有任一选中 → 入站勾选
function toggleSubInbByClients(inbId) {
  const cliCbs = Array.from(document.querySelectorAll('input[name=sub_cli][data-inb="' + inbId + '"]'));
  const inbCb = document.querySelector('input[name=sub_inb][value="' + inbId + '"]');
  if (!inbCb) return;
  inbCb.checked = cliCbs.some(cb => cb.checked);
}
// 客户端是否在订阅筛选中被选中（精确到客户端；入站未勾选则其客户端不选中）
function subClientSelected(inbId, cliId) {
  try {
    const f = JSON.parse(subFiltersBase || '{}');
    // 入站未在 inbound_ids 中（未勾选）时其客户端一律不选中
    if (!(f.inbound_ids || []).includes(inbId)) return false;
    const cids = f.client_ids || [];
    return cids.length ? cids.includes(cliId) : true; // 未精确指定=全选
  } catch (e) { return false; }
}
function buildSubFilters(base) {
  const ids = Array.from(document.querySelectorAll('input[name=sub_inb]:checked')).map(e => +e.value);
  const cliIds = Array.from(document.querySelectorAll('input[name=sub_cli]:checked')).map(e => +e.value);
  let f = {};
  if (base && base.trim()) { try { f = JSON.parse(base); } catch (e) { showToast('已有筛选解析失败', 'err'); return null; } }
  f.inbound_ids = ids;
  // 仅当勾选客户端数量小于其所属入站的客户端总数时写 client_ids（表示精确到部分客户端）
  const totalCli = Array.from(document.querySelectorAll('input[name=sub_cli]')).length;
  if (cliIds.length && cliIds.length < totalCli) f.client_ids = cliIds; else delete f.client_ids;
  return JSON.stringify(f);
}

function validPortRange(s) {
  s = (s || '').trim();
  if (!s) return true;
  if (!/^\d+(-\d+)?(,\d+(-\d+)?)*$/.test(s)) return false;
  for (const p of s.split(',')) {
    if (p.includes('-')) {
      const [a, b] = p.split('-').map(Number);
      if (a < 1 || b > 65535 || a > b) return false;
    } else {
      const v = Number(p);
      if (v < 1 || v > 65535) return false;
    }
  }
  return true;
}
async function doCreateNode() {
  const pr = (val('m_n_pr') || '').trim();
  if (!validPortRange(pr)) return showToast('端口范围格式不正确（如 10000-20000,30000-40000）', 'err');
  const rawRegion = val('m_n_region');
  const region = (rawRegion && !rawRegion.includes('识别') && !rawRegion.includes('失败')) ? val('m_n_country') : '';
  const d = await api('POST', '/nodes', { name: val('m_n_name'), address: val('m_n_addr'), region: region, city: val('m_n_city'), latitude: Number(val('m_n_lat')) || 0, longitude: Number(val('m_n_lon')) || 0, tags: val('m_n_tags').split(',').map(x=>x.trim()).filter(Boolean).join(','), port_range: pr });
  if (d && d.id) {
    await loadNodes();
    // 创建成功后弹窗展示接入方式（复制命令）
    const inst = await api('GET', '/nodes/' + d.id + '/install');
    const cmd = (inst && inst.command) || '';
    installCmdCache = cmd; // 同步缓存，避免复制到上一个节点的命令
    setModal('<h2>接入方式</h2>' +
      '<p class="muted">在节点服务器上执行以下命令即可完成接入：</p>' +
      '<textarea id="installCmd" readonly rows="4" style="width:100%;font-family:monospace;font-size:12px;box-sizing:border-box;word-break:break-all">' + esc(cmd) + '</textarea>' +
      '<div class="btnrow"><button onclick="copyInstall()">复制命令</button><button class="secondary" onclick="closeModal()">完成</button></div>', 'wide');
    showToast('节点已注册', 'ok');
  }
}
async function showCreateSub() {
  if (!inboundCatalog.length) await loadAllInbounds();
  subFiltersBase = ''; // 新建订阅不继承上一个订阅的 filters
  setModal('<h2>新建订阅</h2>' +
    '<label>名称</label><input id="m_s_name" placeholder="如 我的订阅">' +
    '<div class="row">' +
    '<div><label>格式</label><select id="m_s_fmt">' + subFmtOptions('vmess') + '</select></div>' +
    '<div><label>规则</label><select id="m_s_mode">' + subModeOptions('none') + '</select></div></div>' +
    '<label>包含的入站</label>' +
    '<div class="inblist">' + subInboundChecklist([]) + '</div>' +
    '<div class="btnrow"><button onclick="withBusy(this, doCreateSub)">创建</button><button class="secondary" onclick="closeModal()">取消</button></div>');
}
async function doCreateSub() {
  const filters = buildSubFilters('');
  if (filters === null) return;
  const d = await api('POST', '/subscriptions', { name: val('m_s_name'), format: val('m_s_fmt'), mode: val('m_s_mode'), filters });
  if (d) { closeModal(); showToast('订阅已建，token: ' + d.token, 'ok'); await loadSubs(); }
}
function showCreateCert() {
  setModal('<h2>申请证书</h2>' +
    '<label>域名（泛域名）</label><input id="m_dom" placeholder="*.example.com">' +
    '<label>Cloudflare 邮箱（可选）</label><input id="m_cfemail" placeholder="admin@example.com">' +
    '<label>Cloudflare API Token</label><input id="m_cftoken" type="password">' +
    '<label class="chk"><input type="checkbox" id="m_autorenew" checked> 自动续签</label>' +
    '<div class="btnrow"><button onclick="withBusy(this, doCreateCert)">申请并分发</button><button class="secondary" onclick="closeModal()">取消</button></div>');
}
async function doCreateCert() {
  const autorenew = chk('m_autorenew');
  let r;
  try { r = await fetch(API + '/certs', { method:'POST', headers:authH(), body:JSON.stringify({ domain: val('m_dom'), cf_email: val('m_cfemail'), cf_api_token: val('m_cftoken'), auto_renew: autorenew }) }); }
  catch (e) { showToast('网络错误，请检查连接', 'err'); return; }
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { showToast('登录已失效，请重新登录', 'err'); forceLogin(); return; }
  if (r.status === 403 && d.must_change_pwd) { showToast(d.error || '请先修改管理员密码', 'err'); forceChangePw(); return; }
  if (!r.ok && !(r.status === 502 && d.id && d.status === 'failed')) { showToast(d.error || ('请求失败 HTTP ' + r.status), 'err'); return; }
  closeModal();
  await loadCerts();
  if (d.status === 'failed') showToast('证书签发失败，已保留详情：' + (d.error || '未知错误').slice(0, 80), 'err');
  else showToast('证书已签发', 'ok');
  if (d.id) selectCert(d.id);
}

function setAutoSync(v) { autoSync = v; localStorage.setItem('np_autosync', v ? '1' : ''); showToast(v ? '已开启自动下发' : '已关闭自动下发'); }

// ---- 数据加载 ----
async function loadNodes() { const ns = await api('GET', '/nodes'); if (ns) { nodesData = ns; renderSidebar(); if (!sel.type) renderWelcome(); else if (sel.type === 'nodes') renderNodeHub(); } }
async function loadSubs() { const s = await api('GET', '/subscriptions'); if (s) { subsData = s; renderSidebar(); if (!sel.type) renderWelcome(); else if (sel.type === 'resources') renderResourceHub(); } }
async function loadCerts() { const c = await api('GET', '/certs'); if (c) { certsData = c; renderSidebar(); if (!sel.type) renderWelcome(); else if (sel.type === 'resources') renderResourceHub(); } }
async function loadNotifiers() { const n = await api('GET', '/notifiers'); if (n) { notifData = n; renderSidebar(); if (!sel.type) renderWelcome(); else if (sel.type === 'resources') renderResourceHub(); else if (sel.type === 'notifiers') renderNotifierHub(); } }
async function loadAllInbounds() {
  const v = await api('GET', '/inbounds');
  if (v) {
    inboundCatalog = v;
    // 同步填充按节点分组的侧边栏缓存，展开节点时立即可显示入站
    inboundsCache = {};
    // 清理已删除入站的客户端缓存
    const liveIds = new Set(v.map(inb => inb.id));
    Object.keys(clientsCache).forEach(k => { if (!liveIds.has(Number(k))) delete clientsCache[k]; });
    v.forEach(inb => { (inboundsCache[inb.node_id] = inboundsCache[inb.node_id] || []).push(inb); });
    renderSidebar();
    if (!sel.type) renderWelcome(); else if (sel.type === 'inbounds') renderInboundHub();
    // 后台预加载各入站客户端，展开入站时立即可显示（不阻塞当前渲染）
    v.forEach(inb => { ensureClients(inb.id); });
  }
}

async function enterApp() {
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerRight').classList.remove('hidden');
  document.getElementById('accountToggle').classList.remove('hidden');
  document.getElementById('who').textContent = 'admin';
  document.getElementById('autoSyncChk').checked = autoSync;
  renderSidebar(); setLoading('正在初始化控制台…');
  await Promise.all([loadNodes(), loadSubs(), loadCerts(), loadNotifiers(), loadAllInbounds(), loadOverviewStats()]);
  appReady = true;
  if (!location.hash) history.replaceState(null, '', '#/overview');
  await applyRoute();
  if (refreshTimer) clearInterval(refreshTimer);
  if (!MUST_CHANGE_PWD) refreshTimer = setInterval(loadNodes, 30000);
}

window.addEventListener('hashchange', () => { capturePageState(); applyRoute(); });
if (token) enterApp();
else { document.getElementById('loginWrap').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
</script>
