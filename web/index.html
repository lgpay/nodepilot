<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodePilot 控制台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2d3d; color: #fff; padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
  header h1 { font-size: 17px; margin: 0; }
  header .right { display: flex; align-items: center; gap: 10px; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .card h3 { font-size: 13px; margin: 14px 0 8px; color: #555; }
  label { display: block; font-size: 13px; margin: 6px 0 2px; color: #555; }
  input, select { width: 100%; padding: 7px 9px; border: 1px solid #ccd1d9; border-radius: 5px; }
  input:disabled { background: #f0f1f3; color: #888; }
  button { background: #2f6fed; color: #fff; border: 0; padding: 8px 14px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 13px; }
  button:hover { filter: brightness(1.05); }
  button.secondary { background: #6b7785; }
  button.danger { background: #c0392b; }
  button.small { padding: 4px 9px; font-size: 12px; margin-top: 0; }
  button.sm { background: #2f6fed; padding: 2px 8px; font-size: 11px; margin: 0 0 0 6px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .btnrow button { margin-top: 0; }
  .chk { font-size: 13px; color: #555; display: flex; align-items: center; gap: 4px; margin: 0; }
  .chk input { width: auto; margin: 0; }
  .inblist { max-height: 220px; overflow: auto; border: 1px solid #e3e3e3; border-radius: 8px; padding: 8px 10px; background: #fafafa; display: flex; flex-direction: column; gap: 4px; }
  .subgrp { font-size: 12px; font-weight: 600; color: #888; margin-top: 6px; }
  .subgrp:first-child { margin-top: 0; }
  .qr { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .qr img { border: 1px solid #ddd; border-radius: 8px; background: #fff; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  .tbl th { color: #777; font-weight: 600; }
  pre { background: #0f1722; color: #9fe6a0; padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .tag { display: inline-block; background: #eef2f7; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .ok { color: #1a9d54; } .off { color: #c0392b; } .warn { color: #d68910; }
  .hidden { display: none; }
  .muted { color: #888; font-size: 12px; }
  .link { color: #2f6fed; word-break: break-all; }

  /* 布局 */
  #app { flex: 1 1 auto; display: flex; min-height: 0; }
  .sidebar { width: 268px; flex: 0 0 auto; background: #243447; color: #cfd8e3; overflow-y: auto; padding: 10px 8px; }
  .main { flex: 1 1 auto; overflow-y: auto; padding: 18px 22px; }
  .login-card { max-width: 360px; margin: 60px auto; }

  /* 侧边栏树 */
  .sb-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #9fb0c3; margin: 12px 4px 6px; text-transform: uppercase; letter-spacing: .5px; }
  .sb-head:first-child { margin-top: 2px; }
  .ti { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; color: #dbe3ec; }
  .ti:hover { background: #2f3f54; }
  .ti.active { background: #2f6fed; color: #fff; }
  .ti.active .muted { color: #dce6ff; }
  .ti .caret { width: 14px; text-align: center; color: #8aa0b8; user-select: none; flex: 0 0 auto; }
  .ti .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti.indent { padding-left: 26px; }
  .ti.indent2 { padding-left: 44px; }
  .ti.leaf { padding-left: 26px; cursor: default; }
  .ti.leaf2 { padding-left: 44px; cursor: default; }
  .ti.leaf:hover { background: transparent; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .dot.on { background: #1a9d54; } .dot.off { background: #c0392b; } .dot.warn { background: #d68910; }

  .crumb { font-size: 14px; margin-bottom: 12px; color: #555; }
  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow: auto; }
  .modal.hidden { display: none; }
  .modalcard { width: 400px; max-width: 100%; max-height: calc(100vh - 40px); overflow-y: auto; margin: 0; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #1f2d3d; color: #fff; padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99; font-size: 13px; max-width: 80vw; }
  .toast.show { opacity: 1; }

  /* 统计页 */
  .kpis { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .kpi { flex: 1; min-width: 120px; background: #f5f8fc; border: 1px solid #e3e6ea; border-radius: 8px; padding: 14px 16px; }
  .kv { font-size: 22px; font-weight: 600; color: #1f2d3d; }
  .kl { font-size: 12px; color: #888; margin-top: 4px; }
  .bar { display: inline-block; width: 90px; height: 8px; background: #e9edf2; border-radius: 5px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
  .bar span { display: block; height: 100%; background: #2f6fed; }
  .trend { margin-top: 8px; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 12px; }
  .tdate { width: 46px; color: #888; flex: 0 0 auto; }
  .tbar { flex: 1; height: 10px; background: #eef2f7; border-radius: 5px; overflow: hidden; }
  .tbar span { display: block; height: 100%; background: linear-gradient(90deg,#2f6fed,#5ea0ff); }
  .tval { width: 84px; text-align: right; color: #555; flex: 0 0 auto; }
</style>
</head>
<body>

<header>
  <h1>NodePilot 控制台</h1>
  <div id="headerRight" class="right hidden">
    <span id="who" class="muted"></span>
    <button class="secondary small" onclick="showChangePw()">修改密码</button>
    <button class="secondary small" onclick="logout()">退出</button>
  </div>
</header>

<div id="login" class="card login-card">
  <h2>管理员登录</h2>
  <label>用户名</label><input id="user" value="admin">
  <label>密码</label><input id="pass" type="password" value="admin123">
  <button onclick="login()">登录</button>
  <span id="loginMsg" class="muted"></span>
</div>

<div id="app" class="hidden">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="main" class="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="card modalcard" id="modalBody"></div></div>
<div id="toast" class="toast"></div>

<script>
const API = '/api/v1';
let token = localStorage.getItem('np_token') || '';
let sel = { type: null, id: null, parentId: null };
let nodesData = [];
let inboundsCache = {};   // nodeId -> [inbound]
let clientsCache = {};    // inboundId -> [client]
let subsData = [];
let certsData = [];
let notifData = [];
let inboundCatalog = [];
let currentNotifType = 'email';
let expandedNodes = new Set();
let expandedInbounds = new Set();
let autoSync = localStorage.getItem('np_autosync') === '1';
let refreshTimer = null;

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function authH() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }
async function api(method, path, body) {
  const r = await fetch(API + path, { method, headers: authH(), body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { showToast('登录失效，请重新登录'); forceLogin(); return null; }
  return r.json().catch(() => ({}));
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1700);
}
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(t);
    else { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); if (!ok) throw new Error('copy'); }
    showToast('已复制');
  } catch (e) { prompt('复制失败，请手动复制：', t); }
}
async function copySubContent(stoken) {
  try { const r = await fetch(API + '/sub/' + stoken); if (!r.ok) return showToast('获取订阅失败'); copyText(await r.text()); }
  catch (e) { showToast('复制失败'); }
}

// ---- 认证 ----
async function login() {
  const d = await api('POST', '/auth/login', { username: val('user'), password: val('pass') });
  if (d && d.token) { token = d.token; localStorage.setItem('np_token', token); enterApp(); }
  else showToast('登录失败');
}
function logout() { localStorage.removeItem('np_token'); token = ''; location.reload(); }
function forceLogin() {
  // 401 时清空失效 token 并回到登录页，避免“带旧 token 反复 enterApp→401→reload”的死循环
  token = '';
  localStorage.removeItem('np_token');
  const a = document.getElementById('app'); if (a) a.classList.add('hidden');
  const l = document.getElementById('login'); if (l) l.classList.remove('hidden');
}
function showChangePw() {
  setModal(`<h2>修改管理员密码</h2>
    <label>旧密码</label><input id="m_old" type="password">
    <label>新密码</label><input id="m_new" type="password">
    <div class="btnrow"><button onclick="doChangePw()">保存</button><button class="secondary" onclick="closeModal()">取消</button></div>`);
}
async function doChangePw() {
  const d = await api('POST', '/auth/change-password', { old_password: val('m_old'), new_password: val('m_new') });
  if (d && d.ok) { closeModal(); showToast('密码已修改，请重新登录'); setTimeout(() => location.reload(), 900); }
  else if (d) showToast(d.error || '修改失败');
}

// ---- 侧边栏 ----
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let h = '<div class="sb-head">节点<button class="sm" onclick="loadNodes()">刷新</button><button class="sm" onclick="showCreateNode()">+ 注册</button></div>';
  nodesData.forEach(n => {
    const dot = n.status === 'online' ? 'on' : (n.status === 'offline' ? 'off' : (n.connectivity === 'offline' ? 'off' : (n.connectivity === 'ok' ? 'on' : 'warn')));
    const open = expandedNodes.has(n.id);
    h += `<div class="ti ${sel.type === 'node' && sel.id === n.id ? 'active' : ''}" onclick="selectNode(${n.id})">
      <span class="caret" onclick="event.stopPropagation();toggleNode(${n.id})">${open ? '▾' : '▸'}</span>
      <span class="dot ${dot}"></span>
      <span class="lbl">${esc(n.name)} <span class="muted">#${n.id}</span></span></div>`;
    if (open) {
      const ins = inboundsCache[n.id] || [];
      if (!ins.length) h += '<div class="ti leaf muted">（无入站）</div>';
      ins.forEach(inb => {
        const iopen = expandedInbounds.has(inb.id);
        h += `<div class="ti indent ${sel.type === 'inbound' && sel.id === inb.id ? 'active' : ''}" onclick="selectInbound(${inb.id},${n.id})">
          <span class="caret" onclick="event.stopPropagation();toggleInbound(${inb.id})">${iopen ? '▾' : '▸'}</span>
          <span class="lbl">${esc(inboundLabel(inb))}${inb.tls_enabled ? ' 🔒' : ''}${inb.port_auto_fixed ? ' *' : ''}</span></div>`;
        if (iopen) {
          const cls = clientsCache[inb.id] || [];
          if (!cls.length) h += '<div class="ti leaf2 muted">（无客户端）</div>';
          cls.forEach(c => { h += `<div class="ti indent2 ${sel.type === 'client' && sel.id === c.id ? 'active' : ''}" onclick="selectClient(${c.id},${inb.id})"><span class="lbl">${esc(c.alias || c.uuid)}</span></div>`; });
        }
      });
    }
  });
  h += '<div class="sb-head">订阅<button class="sm" onclick="showCreateSub()">+ 新建</button></div>';
  if (!subsData.length) h += '<div class="ti leaf muted">（无订阅）</div>';
  subsData.forEach(s => { const mod = s.mode === 'acl4ssr' ? '·acl4ssr' : ''; h += `<div class="ti ${sel.type === 'sub' && sel.id === s.id ? 'active' : ''}" onclick="selectSub(${s.id})"><span class="lbl">${esc(s.name)} <span class="muted">${s.format}${mod}</span></span></div>`; });
  h += '<div class="sb-head">证书<button class="sm" onclick="showCreateCert()">+ 申请</button></div>';
  if (!certsData.length) h += '<div class="ti leaf muted">（未申请）</div>';
  certsData.forEach(c => { h += `<div class="ti ${sel.type === 'cert' && sel.id === c.id ? 'active' : ''}" onclick="selectCert(${c.id})"><span class="lbl">${esc(c.domain)} <span class="muted">${c.status}</span></span></div>`; });
  h += '<div class="sb-head">通知<button class="sm" onclick="showCreateNotifier()">+ 新建</button></div>';
  if (!notifData.length) h += '<div class="ti leaf muted">（无渠道）</div>';
  notifData.forEach(n => { h += `<div class="ti ${sel.type === 'notifier' && sel.id === n.id ? 'active' : ''}" onclick="selectNotifier(${n.id})"><span class="lbl">${esc(n.name)} <span class="muted">${n.type}</span></span></div>`; });
  h += `<div class="ti ${sel.type === 'stats' ? 'active' : ''}" onclick="selectStats()"><span class="dot on"></span><span class="lbl">📊 统计</span></div>`;
  sb.innerHTML = h;
}

function dotOf(n) { return n.status === 'online' ? 'on' : (n.status === 'offline' ? 'off' : (n.connectivity === 'offline' ? 'off' : (n.connectivity === 'ok' ? 'on' : 'warn'))); }

// ---- 选中 ----
async function selectNode(id) {
  sel = { type: 'node', id, parentId: null };
  expandedNodes.add(id);
  if (!inboundsCache[id]) inboundsCache[id] = await api('GET', '/nodes/' + id + '/inbounds') || [];
  renderSidebar(); renderMain();
}
function toggleNode(id) { if (expandedNodes.has(id)) expandedNodes.delete(id); else expandedNodes.add(id); renderSidebar(); }
async function selectInbound(id, nodeId) {
  sel = { type: 'inbound', id, parentId: nodeId };
  expandedNodes.add(nodeId); expandedInbounds.add(id);
  if (!clientsCache[id]) clientsCache[id] = await api('GET', '/inbounds/' + id + '/clients') || [];
  renderSidebar(); renderMain();
}
function toggleInbound(id) { if (expandedInbounds.has(id)) expandedInbounds.delete(id); else expandedInbounds.add(id); renderSidebar(); }
function selectClient(id, inboundId) { sel = { type: 'client', id, parentId: inboundId }; renderSidebar(); renderMain(); }
function selectSub(id) { sel = { type: 'sub', id, parentId: null }; renderSidebar(); renderMain(); }
function selectCert(id) { sel = { type: 'cert', id, parentId: null }; renderSidebar(); renderMain(); }
function selectStats() { sel = { type: 'stats', parentId: null }; renderSidebar(); renderStats(); }
function selectNotifier(id) { sel = { type: 'notifier', id, parentId: null }; renderSidebar(); renderNotifierDetail(id); }
function toggleCertRow() { const r = document.getElementById('ib_cert_row'); if (r) r.style.display = document.getElementById('ib_tls').checked ? '' : 'none'; }
function certOptions(selId) {
  let h = '<option value="">（默认占位证书）</option>';
  certsData.forEach(c => { h += `<option value="${c.id}" ${selId === c.id ? 'selected' : ''}>${esc(c.domain)} (${esc(c.status)})</option>`; });
  return h;
}

function renderMain() {
  if (!sel.type) return renderWelcome();
  if (sel.type === 'node') renderNodeDetail(sel.id);
  else if (sel.type === 'inbound') renderInboundDetail(sel.id);
  else if (sel.type === 'client') renderClientDetail(sel.id);
  else if (sel.type === 'sub') renderSubDetail(sel.id);
  else if (sel.type === 'cert') renderCertDetail();
  else if (sel.type === 'notifier') renderNotifierDetail(sel.id);
  else if (sel.type === 'stats') renderStats();
  else if (sel.type === 'client') renderClientDetail(sel.id);
  else if (sel.type === 'sub') renderSubDetail(sel.id);
}
function renderWelcome() {
  document.getElementById('main').innerHTML = `<div class="card"><h2>欢迎使用 NodePilot</h2>
    <p class="muted">左侧选择节点 / 入站 / 客户端进行管理；或新建订阅分组，生成 clients 的配置链接。</p>
    <p class="muted">提示：在节点详情点击「下发配置」让改动生效；勾选「自动下发」可在增删改后自动触发。</p></div>`;
}

function fmtBytes(b) {
  b = Number(b) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i === 0 ? b : b.toFixed(2)) + ' ' + u[i];
}

async function renderStats() {
  document.getElementById('main').innerHTML = '<div class="card"><p class="muted">加载中…</p></div>';
  const d = await api('GET', '/stats/overview');
  if (!d) return;
  const today = d.today || { up: 0, down: 0 };

  // 今日卡片
  let h = `<div class="card"><h2>📊 流量统计</h2>
    <div class="kpis">
      <div class="kpi"><div class="kv">${fmtBytes(today.up)}</div><div class="kl">今日上行</div></div>
      <div class="kpi"><div class="kv">${fmtBytes(today.down)}</div><div class="kl">今日下行</div></div>
      <div class="kpi"><div class="kv">${fmtBytes(today.up + today.down)}</div><div class="kl">今日合计</div></div>
    </div></div>`;

  // 节点流量表
  h += `<div class="card"><h3>按节点</h3>`;
  if (!d.nodes || !d.nodes.length) h += '<p class="muted">暂无数据</p>';
  else {
    h += '<table class="tbl"><thead><tr><th>节点</th><th>上行</th><th>下行</th><th>合计</th></tr></thead><tbody>';
    d.nodes.forEach(n => { h += `<tr><td>${esc(n.name || ('#'+n.node_id))}</td><td>${fmtBytes(n.up)}</td><td>${fmtBytes(n.down)}</td><td>${fmtBytes(n.up+n.down)}</td></tr>`; });
    h += '</tbody></table>';
  }
  h += '</div>';

  // 客户端流量表
  h += `<div class="card"><h3>按客户端</h3>`;
  if (!d.clients || !d.clients.length) h += '<p class="muted">暂无数据</p>';
  else {
    h += '<table class="tbl"><thead><tr><th>客户端</th><th>上行</th><th>下行</th><th>合计</th><th>用量</th></tr></thead><tbody>';
    d.clients.forEach(c => {
      const total = (Number(c.up)||0) + (Number(c.down)||0);
      let usage = '—';
      if (c.traffic_limit_bytes && c.traffic_limit_bytes > 0) {
        const pct = Math.min(100, (total / c.traffic_limit_bytes) * 100);
        usage = `<div class="bar"><span style="width:${pct.toFixed(1)}%"></span></div>${pct.toFixed(1)}%`;
      }
      h += `<tr><td>${esc(c.alias || ('#'+c.client_id))}</td><td>${fmtBytes(c.up)}</td><td>${fmtBytes(c.down)}</td><td>${fmtBytes(total)}</td><td>${usage}</td></tr>`;
    });
    h += '</tbody></table>';
  }
  h += '</div>';

  // 30 天趋势
  h += `<div class="card"><h3>近 30 天趋势</h3>`;
  if (!d.daily || !d.daily.length) h += '<p class="muted">暂无数据</p>';
  else {
    let max = 1;
    d.daily.forEach(x => { const t = (Number(x.up)||0)+(Number(x.down)||0); if (t > max) max = t; });
    h += '<div class="trend">';
    d.daily.forEach(x => {
      const t = (Number(x.up)||0)+(Number(x.down)||0);
      const w = Math.max(2, (t / max) * 100);
      h += `<div class="trow"><span class="tdate">${x.date.slice(5)}</span><div class="tbar"><span style="width:${w}%"></span></div><span class="tval">${fmtBytes(t)}</span></div>`;
    });
    h += '</div>';
  }
  h += '</div>';

  document.getElementById('main').innerHTML = h;
}

// ---- 节点详情 ----
async function renderNodeDetail(id) {
  const d = await api('GET', '/nodes/' + id);
  if (!d) return;
  const n = d.node, main = document.getElementById('main');
  const ins = inboundsCache[id] || [];
  let cmd = '';
  const inst = await api('GET', '/nodes/' + id + '/install');
  if (inst) cmd = inst.command || '';
  main.innerHTML = `
    <div class="crumb">节点 / <b>${esc(n.name)}</b> <span class="muted">#${n.id}</span></div>
    <div class="card">
      <div class="row">
        <div><label>名称</label><input id="n_name" value="${esc(n.name)}"></div>
        <div><label>地址 ip:port</label><input id="n_addr" value="${esc(n.address)}" disabled></div>
        <div><label>地域</label><input id="n_region" value="${esc(n.region || '')}"></div>
      </div>
      <div class="row">
        <div><label>标签(逗号)</label><input id="n_tags" value="${esc(n.tags || '')}"></div>
        <div><label>端口范围</label><input id="n_portrange" value="${esc(n.port_range || '')}"></div>
        <div><label>状态 / 连通</label><input value="${esc(n.status)} / ${esc(n.connectivity)}" disabled></div>
      </div>
      <div class="row">

// 入站多选清单（按节点分组），selected 为已选入站 id 数组
function subInboundChecklist(selected) {
  selected = selected || [];
  if (!inboundCatalog.length) return '<div class="muted">（暂无入站，请先在节点下创建）</div>';
  const byNode = {};
  inboundCatalog.forEach(inb => { (byNode[inb.node_id] = byNode[inb.node_id] || []).push(inb); });
  let h = '';
  Object.keys(byNode).forEach(nid => {
    const n = nodesData.find(x => x.id == nid);
    h += `<div class="subgrp">${esc(n ? n.name : '节点#' + nid)}</div>`;
    byNode[nid].forEach(inb => {
      const chk = selected.includes(inb.id) ? 'checked' : '';
      h += `<label class="chk"><input type="checkbox" name="sub_inb" value="${inb.id}" ${chk}> ${esc(inboundLabel(inb))}${inb.tls_enabled ? ' 🔒' : ''}</label>`;
    });
  });
  return h;
}
// 合并勾选入站 + 高级筛选 JSON，返回 filters 字符串；JSON 解析失败返回 null
function buildSubFilters(advId) {
  const ids = Array.from(document.querySelectorAll('input[name=sub_inb]:checked')).map(e => +e.value);
  let adv = {};
  const txt = val(advId);
  if (txt && txt.trim()) {
    try { adv = JSON.parse(txt); } catch (e) { showToast('高级筛选 JSON 解析失败'); return null; }
  }
  const f = Object.assign({}, adv);
  f.inbound_ids = ids;
  return JSON.stringify(f);
}
function subFmtOptions(cur) {
  const fs = [['vmess', 'V2Ray(vmess)'], ['clash', 'Clash'], ['surfboard', 'Surfboard'], ['loon', 'Loon'], ['sip008', 'SIP008']];
  return fs.map(([v, t]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`).join('');
}
function subModeOptions(cur) {
  const ms = [['bare', '裸订阅'], ['acl4ssr', 'ACL4SSR']];
  return ms.map(([v, t]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`).join('');
}

  if (type === 'email') {
    const to = (cfg.to || []).join(', ');
    return `
      <label>SMTP 主机</label><input id="n_host" value="${esc(cfg.smtp_host || '')}">
      <label>SMTP 端口</label><input id="n_port" value="${cfg.smtp_port || 465}">
      <label>发件人</label><input id="n_from" value="${esc(cfg.from || '')}">
      <label>SMTP 用户名</label><input id="n_user" value="${esc(cfg.smtp_user || '')}">
      <label>SMTP 密码</label><input id="n_pass" type="password" value="${esc(cfg.smtp_pass || '')}">
      <label>收件人（逗号分隔）</label><input id="n_to" value="${esc(to)}">
    `;
  } else if (type === 'wecom') {
    return `
      <label>CorpID</label><input id="n_corpid" value="${esc(cfg.corpid || '')}">
      <label>CorpSecret</label><input id="n_secret" type="password" value="${esc(cfg.corpsecret || '')}">
      <label>AgentID</label><input id="n_agentid" value="${cfg.agentid || ''}">
      <label>接收人 touser（@all 或 UserID）</label><input id="n_touser" value="${esc(cfg.touser || '@all')}">
      <label>部门 toparty（可选）</label><input id="n_toparty" value="${esc(cfg.toparty || '')}">
      <label>标签 totag（可选）</label><input id="n_totag" value="${esc(cfg.totag || '')}">
    `;
  } else if (type === 'tg') {
    return `
      <label>Bot Token</label><input id="n_bot" type="password" value="${esc(cfg.bot_token || '')}">
      <label>Chat ID</label><input id="n_chat" value="${esc(cfg.chat_id || '')}">
    `;
  }
  return '';
}
function notifCollectConfig(type) {
  if (type === 'email') {
    const to = val('n_to').split(',').map(s => s.trim()).filter(x => x);
    return JSON.stringify({
      smtp_host: val('n_host'), smtp_port: parseInt(val('n_port') || '465', 10),
      smtp_user: val('n_user'), smtp_pass: val('n_pass'), from: val('n_from'), to
    });
  } else if (type === 'wecom') {
    return JSON.stringify({
      corpid: val('n_corpid'), corpsecret: val('n_secret'),
      agentid: parseInt(val('n_agentid') || '0', 10), touser: val('n_touser'),
      toparty: val('n_toparty'), totag: val('n_totag')
    });
  } else if (type === 'tg') {
    return JSON.stringify({ bot_token: val('n_bot'), chat_id: val('n_chat') });
  }
  return '{}';
}
async function saveNotifier(id) {
  const d = await api('PATCH', '/notifiers/' + id, {
    name: val('n_name2'), enabled: document.getElementById('n_en2').checked,
    config: notifCollectConfig(currentNotifType)
  });
  if (d) { showToast('通知渠道已保存'); await loadNotifiers(); renderNotifierDetail(id); }
}
async function testNotifier(id) {
  const d = await api('POST', '/notifiers/' + id + '/test');
  if (d && d.ok) showToast('测试消息已发送');
  else showToast('发送失败：' + ((d && d.error) || '未知错误').slice(0, 140));
}
async function delNotifier(id) {
  if (!confirm('删除通知渠道 #' + id + '？')) return;
  if (await api('DELETE', '/notifiers/' + id)) { notifData = notifData.filter(x => x.id !== id); if (sel.type === 'notifier' && sel.id === id) sel = { type: null }; renderSidebar(); renderMain(); }
}
function notifTypeOptions(cur) {
  const ts = [['email', '邮件 (SMTP)'], ['wecom', '企业微信 (自建应用)'], ['tg', 'Telegram Bot']];
  return ts.map(([v, t]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${t}</option>`).join('');
}
function onNotifTypeChange() { currentNotifType = val('n_type'); document.getElementById('n_cfg_fields').innerHTML = notifConfigFields(currentNotifType, {}); }
function showCreateNotifier() {
  currentNotifType = 'email';
  setModal(`<h2>新建通知渠道</h2>
    <label>名称</label><input id="n_name" placeholder="我的告警通道">
    <label>类型</label><select id="n_type" onchange="onNotifTypeChange()">${notifTypeOptions('email')}</select>
    <div id="n_cfg_fields">${notifConfigFields('email', {})}</div>
    <div class="btnrow"><button onclick="doCreateNotifier()">创建</button><button class="secondary" onclick="closeModal()">取消</button></div>`);
}
async function doCreateNotifier() {
  const d = await api('POST', '/notifiers', {
    name: val('n_name'), type: val('n_type'), enabled: true,
    config: notifCollectConfig(val('n_type'))
  });
  if (d) { closeModal(); showToast('通知渠道已建 #' + d.id); await loadNotifiers(); }
}

// ---- 弹窗（新建节点 / 新建订阅）----
function setModal(html) { document.getElementById('modalBody').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function showCreateNode() {
  setModal(`<h2>注册节点</h2>
    <label>名称</label><input id="m_n_name" placeholder="hk-01">
    <label>地址 ip:port</label><input id="m_n_addr" placeholder="127.0.0.1:54321">
    <label>地域</label><input id="m_n_region">
    <label>标签(逗号)</label><input id="m_n_tags">
    <label>端口范围</label><input id="m_n_pr" placeholder="10000-65535">
    <div class="btnrow"><button onclick="doCreateNode()">注册</button><button class="secondary" onclick="closeModal()">取消</button></div>`);
}
async function doCreateNode() {
  const d = await api('POST', '/nodes', { name: val('m_n_name'), address: val('m_n_addr'), region: val('m_n_region'), tags: val('m_n_tags'), port_range: val('m_n_pr') });
  if (d) { closeModal(); showToast('节点已注册，token: ' + d.token); copyText(d.token); await loadNodes(); }
}
async function showCreateSub() {
  if (!inboundCatalog.length) await loadAllInbounds();
  setModal(`<h2>新建订阅分组</h2>
    <label>分组名</label><input id="m_s_name" placeholder="my-sub">
    <label>格式</label><select id="m_s_fmt">${subFmtOptions('vmess')}</select>
    <label>模式</label><select id="m_s_mode">${subModeOptions('bare')}</select>
    <label>纳入的入站（多选精确选择；不选则默认全部）</label>
    <div class="inblist">${subInboundChecklist([])}</div>
    <label>高级筛选 JSON（可选：node_ids / protocol / tags）</label>
    <input id="m_s_adv" placeholder='{"node_ids":[9]}'>
    <p class="muted">ACL4SSR 模式对 Clash/Loon/Surfboard 附带分流规则，V2Ray 格式退化为裸链接。</p>
    <div class="btnrow"><button onclick="doCreateSub()">创建</button><button class="secondary" onclick="closeModal()">取消</button></div>`);
}
async function doCreateSub() {
  const filters = buildSubFilters('m_s_adv');
  if (filters === null) return;
  const d = await api('POST', '/subscriptions', { name: val('m_s_name'), format: val('m_s_fmt'), mode: val('m_s_mode'), filters });
  if (d) { closeModal(); showToast('订阅已建，token: ' + d.token); await loadSubs(); }
}
function showCreateCert() {
  setModal(`<h2>申请证书（全流程托管）</h2>
    <label>域名（泛域名，如 *.example.com）</label><input id="m_dom" placeholder="*.example.com">
    <label>Cloudflare 邮箱（可选，使用 API Token 方式无需填写）</label><input id="m_cfemail" placeholder="admin@example.com">
    <label>Cloudflare API Token（需 DNS:Edit 权限）</label><input id="m_cftoken" type="password">
    <label class="chk"><input type="checkbox" id="m_autorenew" checked> 自动续签</label>
    <p class="muted">管理端将通过 Let's Encrypt + Cloudflare DNS-01 校验签发泛域名证书，并自动分发到所有已启用节点。</p>
    <div class="btnrow"><button onclick="doCreateCert()">申请并分发</button><button class="secondary" onclick="closeModal()">取消</button></div>`);
}
async function doCreateCert() {
  const autorenew = document.getElementById('m_autorenew').checked;
  const d = await api('POST', '/certs', { domain: val('m_dom'), cf_email: val('m_cfemail'), cf_api_token: val('m_cftoken'), auto_renew: autorenew });
  if (d) {
    closeModal();
    if (d.id && d.status === 'failed') showToast('已记录（签发失败：' + (d.error || '').slice(0, 80) + '）');
    else showToast('申请已提交');
    await loadCerts();
    if (d && d.id) selectCert(d.id);
  }
}

function setAutoSync(v) { autoSync = v; localStorage.setItem('np_autosync', v ? '1' : ''); showToast(v ? '已开启自动下发' : '已关闭自动下发'); }

// ---- 数据加载 ----
async function loadNodes() { const ns = await api('GET', '/nodes'); if (ns) { nodesData = ns; renderSidebar(); } }
async function loadSubs() { const s = await api('GET', '/subscriptions'); if (s) { subsData = s; renderSidebar(); } }
async function loadCerts() { const c = await api('GET', '/certs'); if (c) { certsData = c; renderSidebar(); } }
async function loadNotifiers() { const n = await api('GET', '/notifiers'); if (n) { notifData = n; renderSidebar(); } }
async function loadAllInbounds() { const v = await api('GET', '/inbounds'); if (v) { inboundCatalog = v; } }

function enterApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerRight').classList.remove('hidden');
  document.getElementById('who').textContent = 'admin';
  renderSidebar(); renderWelcome();
  loadNodes(); loadSubs(); loadCerts(); loadNotifiers(); loadAllInbounds();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadNodes, 30000);
}

if (token) enterApp();
else { document.getElementById('login').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
</script>
</body>
</html>
