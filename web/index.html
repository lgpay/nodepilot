<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NodePilot 控制台</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --border: #e3e7ee; --text: #1f2733; --muted: #8a93a3;
    --primary: #2f6fed; --primary-strong: #2457c9; --danger: #d64545; --danger-strong: #b33535;
    --ok: #1a9d54; --warn: #d68910;
    --header-bg: #1f2d3d; --header-fg: #ffffff;
    --sidebar-bg: #243447; --sidebar-fg: #cfd8e3; --sidebar-hover: #2f3f54; --sidebar-act: #2f6fed;
    --input-bg: #fff; --input-border: #ccd1d9; --input-dis: #f0f1f3;
    --code-bg: #0f1722; --code-fg: #9fe6a0;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
    --shadow-lg: 0 8px 30px rgba(0,0,0,.18);
    --radius: 10px; --radius-sm: 6px;
  }
  [data-theme="dark"] {
    --bg: #10141b; --card: #1a202a; --border: #2a3341; --text: #e4e9f0; --muted: #8792a3;
    --primary: #3b82f6; --primary-strong: #2f6fed; --danger: #e05555; --danger-strong: #c74040;
    --ok: #22c55e; --warn: #e5a53d;
    --header-bg: #0d1117; --header-fg: #e4e9f0;
    --sidebar-bg: #151b24; --sidebar-fg: #a9b4c2; --sidebar-hover: #212a37; --sidebar-act: #2f6fed;
    --input-bg: #131922; --input-border: #333e4c; --input-dis: #20272f;
    --code-bg: #0d1117; --code-fg: #7ee787;
    --shadow: 0 1px 3px rgba(0,0,0,.3); --shadow-lg: 0 8px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 14px; }
  a { color: var(--primary); }

  header { background: var(--header-bg); color: var(--header-fg); padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; box-shadow: var(--shadow); z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .right { display: flex; align-items: center; gap: 10px; }
  header .right .chk { color: var(--header-fg); }
  .burger { display: none; background: transparent; color: var(--header-fg); border: 0; font-size: 20px; cursor: pointer; padding: 0 6px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .card h3 { font-size: 13px; margin: 14px 0 8px; color: var(--muted); }
  label { display: block; font-size: 13px; margin: 8px 0 3px; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--input-border); border-radius: var(--radius-sm); background: var(--input-bg); color: var(--text); font-size: 13px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary); }
  input:disabled { background: var(--input-dis); color: var(--muted); }
  button { background: var(--primary); color: #fff; border: 0; padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; margin-top: 10px; font-size: 13px; font-weight: 500; transition: background .15s, filter .15s, opacity .15s; }
  button:hover { background: var(--primary-strong); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button.secondary { background: #6b7785; } button.secondary:hover { background: #58636f; }
  [data-theme="dark"] button.secondary { background: #3a4553; } [data-theme="dark"] button.secondary:hover { background: #465260; }
  button.danger { background: var(--danger); } button.danger:hover { background: var(--danger-strong); }
  button.small { padding: 4px 10px; font-size: 12px; margin-top: 0; }
  button.sm { padding: 2px 8px; font-size: 11px; margin: 0 0 0 6px; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .btnrow button { margin-top: 0; }
  .chk { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; }
  .chk input { width: auto; margin: 0; }
  .inblist { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--bg); display: flex; flex-direction: column; gap: 5px; }
  .subgrp { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 8px; }
  .subgrp:first-child { margin-top: 0; }
  .qr { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .qr img { border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; min-width: 0; }

  .tblwrap { overflow: auto; max-height: 440px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); z-index: 1; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr:hover { background: rgba(47,111,237,.05); }
  .search { margin-bottom: 10px; max-width: 260px; }

  pre { background: var(--code-bg); color: var(--code-fg); padding: 12px; border-radius: var(--radius-sm); overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 420px; }
  .badge { display: inline-block; background: #eef2f7; color: #4b5563; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  [data-theme="dark"] .badge { background: #263041; color: #b6c2d4; }
  .badge.blue { background: #e7efff; color: #2457c9; }
  [data-theme="dark"] .badge.blue { background: #1d2d4f; color: #7aa8ff; }
  .ok { color: var(--ok); } .off { color: var(--danger); } .warn { color: var(--warn); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 12px; }
  .link { color: var(--primary); word-break: break-all; }

  #app { flex: 1 1 auto; display: flex; min-height: 0; }
  .sidebar { width: 272px; flex: 0 0 auto; background: var(--sidebar-bg); color: var(--sidebar-fg); overflow-y: auto; padding: 10px 8px 20px; }
  .main { flex: 1 1 auto; overflow-y: auto; padding: 18px 22px; }
  .login-card { max-width: 380px; margin: 70px auto; }

  .sb-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #9fb0c3; margin: 14px 4px 6px; text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  .sb-head:first-child { margin-top: 2px; }
  .ti { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: #dbe3ec; }
  .ti:hover { background: var(--sidebar-hover); }
  .ti.active { background: var(--sidebar-act); color: #fff; }
  .ti.active .muted { color: #dce6ff; }
  .ti .caret { width: 14px; text-align: center; color: #8aa0b8; user-select: none; flex: 0 0 auto; }
  .ti.active .caret { color: #fff; }
  .ti .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti.indent { padding-left: 28px; }
  .ti.indent2 { padding-left: 48px; }
  .ti.leaf { padding-left: 28px; cursor: default; }
  .ti.leaf2 { padding-left: 48px; cursor: default; }
  .ti.leaf:hover { background: transparent; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--danger); } .dot.warn { background: var(--warn); }

  .crumb { font-size: 14px; margin-bottom: 14px; color: var(--muted); }
  .crumb b { color: var(--text); }

  .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow: auto; }
  .modal.hidden { display: none; }
  .modalcard { width: 440px; max-width: 100%; max-height: calc(100vh - 40px); overflow-y: auto; margin: 0; box-shadow: var(--shadow-lg); }

  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(8px); background: var(--header-bg); color: var(--header-fg); padding: 9px 18px; border-radius: 8px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 99; font-size: 13px; max-width: 80vw; box-shadow: var(--shadow-lg); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--ok); }
  .toast.err { background: var(--danger); }
  .toast.warn { background: var(--warn); }

  .kpis { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .kpi { flex: 1; min-width: 130px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .kv { font-size: 24px; font-weight: 700; color: var(--text); }
  .kl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .bar { display: inline-block; width: 90px; height: 8px; background: var(--border); border-radius: 5px; overflow: hidden; vertical-align: middle; margin-right: 6px; }
  .bar span { display: block; height: 100%; background: var(--primary); }
  .trend { margin-top: 8px; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 12px; }
  .tdate { width: 46px; color: var(--muted); flex: 0 0 auto; }
  .tbar { flex: 1; height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .tbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #5ea0ff); }
  .tval { width: 84px; text-align: right; color: var(--text); flex: 0 0 auto; }

  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .qcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, border-color .12s, box-shadow .12s; }
  .qcard:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-lg); }
  .qcard .ic { font-size: 26px; }
  .qcard .tt { font-weight: 600; margin-top: 8px; }
  .qcard .ds { font-size: 12px; color: var(--muted); margin-top: 4px; }

  details.adv { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 10px; background: var(--bg); }
  details.adv summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details.adv[open] summary { margin-bottom: 8px; }
  .loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 30px 0; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 52px; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform .2s; width: 260px; }
    .sidebar.open { transform: translateX(0); }
    .burger { display: block; }
    .main { padding: 12px; }
    .row { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="burger" id="burgerBtn" onclick="toggleSidebar()">☰</button>
    <h1>NodePilot 控制台</h1>
  </div>
  <div id="headerRight" class="right hidden">
    <label class="chk"><input type="checkbox" id="autoSyncChk" onchange="setAutoSync(this.checked)"> 自动下发</label>
    <button class="secondary small" id="darkBtn" onclick="toggleDark()">🌙 暗色</button>
    <span id="who" class="muted" style="color:#9fb0c3"></span>
    <button class="secondary small" onclick="showChangePw()">修改密码</button>
    <button class="secondary small" onclick="logout()">退出</button>
  </div>
</header>

<div id="login" class="card login-card hidden">
  <h2>管理员登录</h2>
  <label>用户名</label><input id="user" value="admin">
  <label>密码</label><input id="pass" type="password" placeholder="请输入密码">
  <button onclick="login()" style="width:100%">登录</button>
  <span id="loginMsg" class="muted"></span>
</div>

<div id="app" class="hidden">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="main" class="main"></main>
</div>

<div id="modal" class="modal hidden"><div class="card modalcard" id="modalBody"></div></div>
<div id="toast" class="toast"></div>

<script>
const API = '/api/v1';
let token = localStorage.getItem('np_token') || '';
let sel = { type: null, id: null, parentId: null };
let nodesData = [];
let inboundsCache = {};   // nodeId -> [inbound]
let clientsCache = {};    // inboundId -> [client]
let subsData = [];
let certsData = [];
let notifData = [];
let inboundCatalog = [];
let currentNotifType = 'email';
let expandedNodes = new Set();
let expandedInbounds = new Set();
let autoSync = localStorage.getItem('np_autosync') === '1';
let dark = localStorage.getItem('np_dark') === '1';
let refreshTimer = null;
let confirmRes = null;
let statsData = null;

// ---- 主题 ----
function applyTheme() {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const b = document.getElementById('darkBtn'); if (b) b.textContent = dark ? '☀️ 浅色' : '🌙 暗色';
}
function toggleDark() { dark = !dark; localStorage.setItem('np_dark', dark ? '1' : ''); applyTheme(); }
applyTheme();

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function chk(id) { const e = document.getElementById(id); return e ? e.checked : false; }
function authH() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

// api：非 2xx 统一 toast 服务端 error 并返回 null，避免"失败却提示成功"
async function api(method, path, body) {
  let r;
  try { r = await fetch(API + path, { method, headers: authH(), body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { showToast('网络错误，请检查连接', 'err'); return null; }
  if (r.status === 401 && path !== '/auth/login') {
    showToast('登录已失效，请重新登录');
    forceLogin(); return null;
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { showToast(data.error || ('请求失败 HTTP ' + r.status), 'err'); return null; }
  return data;
}

let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(t);
    else { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); if (!ok) throw new Error('copy'); }
    showToast('已复制', 'ok');
  } catch (e) { prompt('复制失败，请手动复制：', t); }
}
async function copySubContent(stoken) {
  try { const r = await fetch(API + '/sub/' + stoken); if (!r.ok) return showToast('获取订阅失败', 'err'); copyText(await r.text()); }
  catch (e) { showToast('复制失败', 'err'); }
}
// 防重复提交：禁用按钮 + "处理中…"，finally 恢复
async function withBusy(btn, fn) {
  if (!btn) return fn();
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '处理中…';
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = old; }
}
// 自定义确认弹窗（Promise<boolean>）
function confirmModal(msg) {
  return new Promise(res => {
    confirmRes = res;
    setModal('<h2>确认操作</h2><p style="margin:6px 0">' + esc(msg) + '</p>' +
      '<div class="btnrow"><button onclick="confirmOk()">确认</button><button class="secondary" onclick="closeModal()">取消</button></div>');
  });
}
function confirmOk() { closeModal(); if (confirmRes) { const r = confirmRes; confirmRes = null; r(true); } }
function setModal(html) { document.getElementById('modalBody').innerHTML = html; document.getElementById('modal').classList.remove('hidden'); }
function closeModal() { document.getElementById('modal').classList.add('hidden'); if (confirmRes) { const r = confirmRes; confirmRes = null; r(false); } }

// ---- 认证 ----
async function login() {
  const d = await api('POST', '/auth/login', { username: val('user'), password: val('pass') });
  if (d && d.token) { token = d.token; localStorage.setItem('np_token', token); enterApp(); }
  else showToast('登录失败', 'err');
}
function logout() { localStorage.removeItem('np_token'); token = ''; location.reload(); }
function forceLogin() {
  token = '';
  localStorage.removeItem('np_token');
  const a = document.getElementById('app'); if (a) a.classList.add('hidden');
  const l = document.getElementById('login'); if (l) l.classList.remove('hidden');
}
function showChangePw() {
  setModal('<h2>修改管理员密码</h2>' +
    '<label>旧密码</label><input id="m_old" type="password">' +
    '<label>新密码</label><input id="m_new" type="password">' +
    '<div class="btnrow"><button onclick="withBusy(this, doChangePw)">保存</button><button class="secondary" onclick="closeModal()">取消</button></div>');
}
async function doChangePw() {
  const d = await api('POST', '/auth/change-password', { old_password: val('m_old'), new_password: val('m_new') });
  if (d && d.ok) { closeModal(); showToast('密码已修改，请重新登录', 'ok'); setTimeout(() => location.reload(), 900); }
}
// 弹窗内回车触发第一个主按钮
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const m = document.getElementById('modal');
    if (m && !m.classList.contains('hidden')) {
      const btn = m.querySelector('.btnrow button:not(.secondary)');
      if (btn) btn.click();
    }
  }
});

// ---- 侧边栏 ----
function dotOf(n) { return n.status === 'online' ? 'on' : (n.status === 'offline' ? 'off' : (n.connectivity === 'offline' ? 'off' : (n.connectivity === 'ok' ? 'on' : 'warn'))); }
function inboundLabel(inb) { return inb.name || ((inb.protocol || '?') + ':' + (inb.port || '?')); }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let h = '<div class="sb-head">节点<span><button class="sm" onclick="loadNodes()">刷新</button><button class="sm" onclick="syncAllNodes()">全部下发</button><button class="sm" onclick="showCreateNode()">+ 注册</button></span></div>';
  nodesData.forEach(n => {
    const dot = dotOf(n);
    const open = expandedNodes.has(n.id);
    h += '<div class="ti ' + (sel.type === 'node' && sel.id === n.id ? 'active' : '') + '" onclick="selectNode(' + n.id + ')">' +
      '<span class="caret" onclick="event.stopPropagation();toggleNode(' + n.id + ')">' + (open ? '▾' : '▸') + '</span>' +
      '<span class="dot ' + dot + '"></span>' +
      '<span class="lbl">' + esc(n.name) + ' <span class="muted">#' + n.id + '</span></span></div>';
    if (open) {
      const ins = inboundsCache[n.id] || [];
      if (!ins.length) h += '<div class="ti leaf muted">（无入站）</div>';
      ins.forEach(inb => {
        const iopen = expandedInbounds.has(inb.id);
        h += '<div class="ti indent ' + (sel.type === 'inbound' && sel.id === inb.id ? 'active' : '') + '" onclick="selectInbound(' + inb.id + ',' + n.id + ')">' +
          '<span class="caret" onclick="event.stopPropagation();toggleInbound(' + inb.id + ')">' + (iopen ? '▾' : '▸') + '</span>' +
          '<span class="lbl">' + esc(inboundLabel(inb)) + (inb.tls_enabled ? ' 🔒' : '') + (inb.port_auto_fixed ? ' *' : '') + '</span></div>';
        if (iopen) {
          const cls = clientsCache[inb.id] || [];
          if (!cls.length) h += '<div class="ti leaf2 muted">（无客户端）</div>';
          cls.forEach(c => { h += '<div class="ti indent2 ' + (sel.type === 'client' && sel.id === c.id ? 'active' : '') + '" onclick="selectClient(' + c.id + ',' + inb.id + ')"><span class="lbl">' + esc(c.alias || c.uuid) + '</span></div>'; });
        }
      });
    }
  });
  h += '<div class="sb-head">订阅<button class="sm" onclick="showCreateSub()">+ 新建</button></div>';
  if (!subsData.length) h += '<div class="ti leaf muted">（无订阅）</div>';
  subsData.forEach(s => {
    const mod = (s.mode === 'acl4ssr' || s.mode === 'acl4ssr_online') ? '<span class="badge blue">ACL4SSR</span>' : '<span class="badge">无规则</span>';
    h += '<div class="ti ' + (sel.type === 'sub' && sel.id === s.id ? 'active' : '') + '" onclick="selectSub(' + s.id + ')">' +
      '<span class="lbl">' + esc(s.name) + ' <span class="muted">' + s.format + '</span> ' + mod + '</span>' +
      '<button class="sm" title="复制订阅链接" onclick="event.stopPropagation();copyText(location.origin+\'/api/v1/sub/' + s.token + '\')">⧉</button></div>';
  });
  h += '<div class="sb-head">证书<button class="sm" onclick="showCreateCert()">+ 申请</button></div>';
  if (!certsData.length) h += '<div class="ti leaf muted">（未申请）</div>';

function fmtBytes(b) {
  b = Number(b) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i === 0 ? b : b.toFixed(2)) + ' ' + u[i];
}

function renderStatsView() {
  const d = statsData; if (!d) return;
  const today = d.today || { up: 0, down: 0 };
  let h = '<div class="card"><h2>📊 流量统计</h2><div class="kpis">' +
    '<div class="kpi"><div class="kv">' + fmtBytes(today.up) + '</div><div class="kl">今日上行</div></div>' +
    '<div class="kpi"><div class="kv">' + fmtBytes(today.down) + '</div><div class="kl">今日下行</div></div>' +
    '<div class="kpi"><div class="kv">' + fmtBytes(today.up + today.down) + '</div><div class="kl">今日合计</div></div></div></div>';

  h += '<div class="card"><h3>按节点</h3>';
  if (!d.nodes || !d.nodes.length) h += '<p class="muted">暂无数据</p>';
  else {
    h += '<div class="tblwrap"><table class="tbl"><thead><tr><th>节点</th><th>上行</th><th>下行</th><th>合计</th></tr></thead><tbody>';
    d.nodes.forEach(n => { h += '<tr><td>' + esc(n.name || ('#' + n.node_id)) + '</td><td>' + fmtBytes(n.up) + '</td><td>' + fmtBytes(n.down) + '</td><td>' + fmtBytes(n.up + n.down) + '</td></tr>'; });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  h += '<div class="card"><h3>按客户端</h3>';
  if (!d.clients || !d.clients.length) h += '<p class="muted">暂无数据</p>';
  else {
    h += '<input class="search" placeholder="搜索客户端…" oninput="filterRows(\'stats_clients_tb\', this.value)">';
    h += '<div class="tblwrap"><table class="tbl"><thead><tr><th>客户端</th><th>上行</th><th>下行</th><th>合计</th><th>用量</th></tr></thead><tbody id="stats_clients_tb">';
    d.clients.forEach(c => {
      const total = (Number(c.up) || 0) + (Number(c.down) || 0);
      let usage = '—';
      if (c.traffic_limit_bytes && c.traffic_limit_bytes > 0) {
        const pct = Math.min(100, (total / c.traffic_limit_bytes) * 100);
        usage = '<div class="bar"><span style="width:' + pct.toFixed(1) + '%"></span></div>' + pct.toFixed(1) + '%';
      }
      h += '<tr><td>' + esc(c.alias || ('#' + c.client_id)) + '</td><td>' + fmtBytes(c.up) + '</td><td>' + fmtBytes(c.down) + '</td><td>' + fmtBytes(total) + '</td><td>' + usage + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  h += '<div class="card"><h3>近 30 天趋势</h3>';
  if (!d.daily || !d.daily.length) h += '<p class="muted">暂无数据</p>';
  else {
    let max = 1;
    d.daily.forEach(x => { const t = (Number(x.up) || 0) + (Number(x.down) || 0); if (t > max) max = t; });
    h += '<div class="trend">';
    d.daily.forEach(x => {
      const t = (Number(x.up) || 0) + (Number(x.down) || 0);
      const w = Math.max(2, (t / max) * 100);
      h += '<div class="trow"><span class="tdate">' + x.date.slice(5) + '</span><div class="tbar"><span style="width:' + w + '%"></span></div><span class="tval">' + fmtBytes(t) + '</span></div>';
    });
    h += '</div>';
  }
  h += '</div>';
  document.getElementById('main').innerHTML = h;
}
function filterRows(tbId, q) {

async function saveNode(id) {
  const d = await api('PATCH', '/nodes/' + id, { name: val('n_name'), region: val('n_region'), tags: val('n_tags'), port_range: val('n_portrange') });
  if (d) {
    const i = nodesData.findIndex(x => x.id === id); if (i >= 0) nodesData[i] = { ...nodesData[i], name: val('n_name'), region: val('n_region'), tags: val('n_tags'), port_range: val('n_portrange') };
    showToast('节点已保存', 'ok'); if (autoSync) await syncNode(id); renderSidebar(); renderNodeDetail(id);
  }
}
async function syncNode(id) {
  const d = await api('POST', '/nodes/' + id + '/config/sync');
  if (d) { showToast('已下发配置', 'ok'); renderNodeDetail(id); }
  return d;
}
async function syncAllNodes() {
  if (!nodesData.length) return showToast('暂无节点', 'warn');
  if (!await confirmModal('确认向全部 ' + nodesData.length + ' 个节点下发最新配置？')) return;
  let ok = 0, fail = 0;
  showToast('开始下发…');
  for (const n of nodesData) { const d = await api('POST', '/nodes/' + n.id + '/config/sync'); if (d) ok++; else fail++; }
  showToast('下发完成：' + ok + ' 成功' + (fail ? '，' + fail + ' 失败' : ''), fail ? (ok ? 'warn' : 'err') : 'ok');
  loadNodes();
}
async function showNodeToken(id) { const d = await api('GET', '/nodes/' + id); if (d && d.token) { copyText(d.token); } }
async function copyInstall() { const t = document.getElementById('installCmd'); if (t) { copyText(t.value); } }
async function delNode(id) {
  if (!await confirmModal('确认删除节点 #' + id + '？其入站/客户端也会失效')) return;
  const d = await api('DELETE', '/nodes/' + id);
  if (d) { delete inboundsCache[id]; const i = nodesData.findIndex(x => x.id === id); if (i >= 0) nodesData.splice(i, 1); expandedNodes.delete(id); if (sel.type === 'node' && sel.id === id) sel = { type: null }; renderSidebar(); renderMain(); }
}
async function createInbound(nodeId) {
  const d = await api('POST', '/nodes/' + nodeId + '/inbounds', { name: val('i_name'), protocol: val('i_proto'), port: +val('i_port'), transport: val('i_trans'), tls_enabled: chk('i_tls') });

}
async function delInbound(id, nodeId) {
  if (!await confirmModal('删除入站 #' + id + '？')) return;
  const d = await api('DELETE', '/inbounds/' + id);
  if (d) { delete clientsCache[id]; expandedInbounds.delete(id); inboundsCache[nodeId] = inboundsCache[nodeId].filter(x => x.id !== id); if (sel.type === 'inbound' && sel.id === id) sel = { type: 'node', id: nodeId }; renderSidebar(); renderNodeDetail(nodeId); }
}

// ---- 到期时间转换 ----
function toDTLocal(s) {
  if (!s) return '';
  const d = new Date(s); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromDTLocal(s) { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return d.toISOString(); }

async function saveInbound(id) {

  const d = await api('PUT', '/inbounds/' + id, { name: val('ib_name'), protocol: val('ib_proto'), port: +val('ib_port'), transport: val('ib_trans'), tls_enabled: chk('ib_tls'), enabled: chk('ib_enabled'), cert_id: (val('ib_cert') ? +val('ib_cert') : null) });
  if (d) {
    const arr = inboundsCache[nodeId] || []; const i = arr.findIndex(x => x.id === id);
    if (i >= 0) arr[i] = { ...arr[i], name: val('ib_name'), protocol: val('ib_proto'), port: +val('ib_port'), transport: val('ib_trans'), tls_enabled: chk('ib_tls'), enabled: chk('ib_enabled'), tls_cert_id: (val('ib_cert') ? +val('ib_cert') : null) };

  }
}

async function delClient(id, inboundId) {

async function loadSubPreview(token) {
  const pre = document.getElementById('sub_preview'); if (!pre || pre.dataset.loaded) return;
  pre.dataset.loaded = '1';
  try {
    const r = await fetch(API + '/sub/' + token);
    if (!r.ok) { pre.textContent = '获取失败 HTTP ' + r.status; return; }
    pre.textContent = await r.text();
    pre.classList.remove('muted');
  } catch (e) { pre.textContent = '获取失败'; }
}
async function saveSub(id) {
  const filters = buildSubFilters('s_adv2', 's_tags2');
  if (filters === null) return;
  const d = await api('PATCH', '/subscriptions/' + id, { name: val('s_name2'), format: val('s_fmt2'), mode: val('s_mode2'), enabled: chk('s_en2'), filters });
  if (d) {
    const i = subsData.findIndex(x => x.id === id); if (i >= 0) subsData[i] = { ...subsData[i], name: val('s_name2'), format: val('s_fmt2'), mode: val('s_mode2'), enabled: chk('s_en2'), filters };
    showToast('订阅已保存', 'ok'); renderSidebar(); renderSubDetail(id);
  }
}
function subInboundChecklist(selected) {
  selected = selected || [];
  if (!inboundCatalog.length) return '<div class="muted">（暂无入站，请先在节点下创建）</div>';
  const byNode = {};
  inboundCatalog.forEach(inb => { (byNode[inb.node_id] = byNode[inb.node_id] || []).push(inb); });
  let h = '';
  Object.keys(byNode).forEach(nid => {
    const n = nodesData.find(x => x.id == nid);
    h += '<div class="subgrp">' + esc(n ? n.name : '节点#' + nid) + '</div>';
    byNode[nid].forEach(inb => {
      const chk = selected.includes(inb.id) ? 'checked' : '';
      h += '<label class="chk"><input type="checkbox" name="sub_inb" value="' + inb.id + '" ' + chk + '> ' + esc(inboundLabel(inb)) + (inb.tls_enabled ? ' 🔒' : '') + '</label>';
    });
  });
  return h;
}
function subNodeChecklist(selected) {
  selected = selected || [];
  if (!nodesData.length) return '<div class="muted">（暂无节点）</div>';
  return nodesData.map(n => '<label class="chk"><input type="checkbox" name="sub_node" value="' + n.id + '" ' + (selected.includes(n.id) ? 'checked' : '') + '> ' + esc(n.name) + ' <span class="muted">#' + n.id + '</span></label>').join('');
}
function subProtoChecklist(selected) {
  selected = selected || [];
  const ps = ['vmess', 'vless', 'trojan', 'ss', 'socks', 'http'];
  return ps.map(p => '<label class="chk"><input type="checkbox" name="sub_proto" value="' + p + '" ' + (selected.includes(p) ? 'checked' : '') + '> ' + p + '</label>').join('');
}
function buildSubFilters(advId, tagsId) {
  const ids = Array.from(document.querySelectorAll('input[name=sub_inb]:checked')).map(e => +e.value);
  const nids = Array.from(document.querySelectorAll('input[name=sub_node]:checked')).map(e => +e.value);
  const protos = Array.from(document.querySelectorAll('input[name=sub_proto]:checked')).map(e => e.value);
  let adv = {};
  const txt = val(advId);
  if (txt && txt.trim()) { try { adv = JSON.parse(txt); } catch (e) { showToast('高级筛选 JSON 解析失败', 'err'); return null; } }
  const f = Object.assign({}, adv);
  f.inbound_ids = ids;
  if (nids.length) f.node_ids = nids; else delete f.node_ids;
  if (protos.length) f.protocol = protos; else delete f.protocol;
  const tags = (val(tagsId) || '').split(',').map(s => s.trim()).filter(Boolean);
  if (tags.length) f.tags = tags; else delete f.tags;
  return JSON.stringify(f);
}
function subFmtOptions(cur) {
  const fs = [['vmess', 'V2Ray(vmess)'], ['clash', 'Clash'], ['surfboard', 'Surfboard'], ['loon', 'Loon'], ['sip008', 'SIP008']];
  return fs.map(([v, t]) => '<option value="' + v + '" ' + (cur === v ? 'selected' : '') + '>' + t + '</option>').join('');
}
function subModeOptions(cur) {
  const ms = [['none', '无规则'], ['acl4ssr_online', 'ACL4SSR_Online']];
  return ms.map(([v, t]) => '<option value="' + v + '" ' + (cur === v ? 'selected' : '') + '>' + t + '</option>').join('');
}

    '<p class="muted">ACL4SSR 模式对 Clash/Loon/Surfboard 附带分流规则，V2Ray 格式退化为纯节点链接。</p>' +
    '<div class="btnrow"><button onclick="withBusy(this, doCreateSub)">创建</button><button class="secondary" onclick="closeModal()">取消</button></div>');
}
async function doCreateSub() {
  const filters = buildSubFilters('m_s_adv', 'm_s_tags');
  if (filters === null) return;
  const d = await api('POST', '/subscriptions', { name: val('m_s_name'), format: val('m_s_fmt'), mode: val('m_s_mode'), filters });
  if (d) { closeModal(); showToast('订阅已建，token: ' + d.token, 'ok'); await loadSubs(); }
}
function showCreateCert() {
  setModal('<h2>申请证书（全流程托管）</h2>' +
    '<label>域名（泛域名，如 *.example.com）</label><input id="m_dom" placeholder="*.example.com">' +
    '<label>Cloudflare 邮箱（可选，使用 API Token 方式无需填写）</label><input id="m_cfemail" placeholder="admin@example.com">' +
    '<label>Cloudflare API Token（需 DNS:Edit 权限）</label><input id="m_cftoken" type="password">' +
    '<label class="chk"><input type="checkbox" id="m_autorenew" checked> 自动续签</label>' +
    '<p class="muted">管理端将通过 Let\'s Encrypt + Cloudflare DNS-01 校验签发泛域名证书，并自动分发到所有已启用节点。</p>' +
    '<div class="btnrow"><button onclick="withBusy(this, doCreateCert)">申请并分发</button><button class="secondary" onclick="closeModal()">取消</button></div>');
}
async function doCreateCert() {
  const autorenew = chk('m_autorenew');
  const d = await api('POST', '/certs', { domain: val('m_dom'), cf_email: val('m_cfemail'), cf_api_token: val('m_cftoken'), auto_renew: autorenew });
  if (d) {
    closeModal();
    if (d.id && d.status === 'failed') showToast('已记录（签发失败：' + (d.error || '').slice(0, 80) + '）', 'warn');
    else showToast('申请已提交', 'ok');
    await loadCerts();
    if (d && d.id) selectCert(d.id);
  }
}

function setAutoSync(v) { autoSync = v; localStorage.setItem('np_autosync', v ? '1' : ''); showToast(v ? '已开启自动下发' : '已关闭自动下发'); }

// ---- 数据加载 ----
async function loadNodes() { const ns = await api('GET', '/nodes'); if (ns) { nodesData = ns; renderSidebar(); } }
async function loadSubs() { const s = await api('GET', '/subscriptions'); if (s) { subsData = s; renderSidebar(); } }
async function loadCerts() { const c = await api('GET', '/certs'); if (c) { certsData = c; renderSidebar(); } }
async function loadNotifiers() { const n = await api('GET', '/notifiers'); if (n) { notifData = n; renderSidebar(); } }
async function loadAllInbounds() { const v = await api('GET', '/inbounds'); if (v) { inboundCatalog = v; } }

function enterApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('headerRight').classList.remove('hidden');
  document.getElementById('who').textContent = 'admin';
  document.getElementById('autoSyncChk').checked = autoSync;
  renderSidebar(); renderWelcome();
  loadNodes(); loadSubs(); loadCerts(); loadNotifiers(); loadAllInbounds();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadNodes, 30000);
}

if (token) enterApp();
else { document.getElementById('login').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); }
</script>
</body>
</html>
